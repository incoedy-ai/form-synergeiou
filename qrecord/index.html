<body>
<div class="wrap" id="app"></div>

<script>
'use strict';
// ====================================================================== ρυθμίσεις
const API = 'https://script.google.com/macros/s/AKfycbwRoyNlK_CkIEShRA3_hVUpeTT117EprA1xdvi9ZWrvh5w0r-8B2mVLDPnp8_cSGyx9qA/exec';

// «Λάθος πληκτρολόγηση» (23/10): η λάθος τιμή ΜΕΝΕΙ στο αρχείο με αυτή τη σημείωση και η σωστή μπαίνει αμέσως μετά.
const LATHOS = 'Λάθος πληκτρολόγηση';
const ENERGEIES_KRYO = ['Η πόρτα είχε μείνει ανοιχτή', 'Μόλις είχαν μπει νέα προϊόντα', 'Ρυθμίστηκε ο θερμοστάτης',
  'Τα προϊόντα μεταφέρθηκαν σε άλλη συσκευή', 'Απορρίφθηκαν προϊόντα', 'Κλήθηκε τεχνικός', LATHOS];
const ENERGEIES_ZESTO = ['Αυξήθηκε η θερμοκρασία της συσκευής', 'Το φαγητό ξαναζεστάθηκε', 'Απορρίφθηκε φαγητό', 'Κλήθηκε τεχνικός', LATHOS];
const MINES = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const MINON = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];
const MERES = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const SYXN = {'ΗΜΕΡΗΣΙΑ': 'Κάθε μέρα', 'ΕΒΔΟΜΑΔΙΑΙΑ': 'Μία φορά την εβδομάδα', 'ΜΗΝΙΑΙΑ': 'Μία φορά τον μήνα'};
const REMEASURE_MIN = 30;

// ====================================================================== βοηθητικά
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function fmtLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
const now = () => fmtLocal(new Date());
const today = () => now().slice(0, 10);
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => (v === null || v === undefined || v === '') ? '' : String(v).replace('.', ',');
const hhmm = ts => (ts || '').slice(11, 16);
const ddmm = ts => ts ? ts.slice(8, 10) + '/' + ts.slice(5, 7) : '';
const ddmmyyyy = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
const minasTitlos = m => MINES[+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4);
const tsToDate = ts => new Date(ts.slice(0, 10) + 'T' + ts.slice(11, 16) + ':00');
const clone = o => JSON.parse(JSON.stringify(o));
function deftera(day) { const d = new Date(day + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return fmtLocal(d).slice(0, 10); }
function periodos(syx, day) { return syx === 'ΕΒΔΟΜΑΔΙΑΙΑ' ? 'W' + deftera(day) : syx === 'ΜΗΝΙΑΙΑ' ? day.slice(0, 7) : day; }
function apotelesma(s, t) { return (s.apo === null || t >= s.apo) && (s.eos === null || t <= s.eos) ? 'ΕΝΤΟΣ' : 'ΕΚΤΟΣ'; }
const HOMO = {A:'Α',B:'Β',E:'Ε',Z:'Ζ',H:'Η',I:'Ι',K:'Κ',M:'Μ',N:'Ν',O:'Ο',P:'Ρ',T:'Τ',Y:'Υ',X:'Χ'};
const kodN = v => String(v || '').trim().toUpperCase().split('').map(c => HOMO[c] || c).join('');
// 23/10: 2 μετρήσεις την ημέρα σε κάθε συσκευή — ΥΠΟΧΡΕΩΣΗ (ελάχιστο), όχι προεπιλογή
const fores = s => Math.max(2, +s.ana_imera || 0);
function zesto(s) { return /ΘΕΡΜ/.test(s.typos || ''); }
function typosLabel(t) { return ({'ΨΥΓΕΙΟ': 'Ψυγείο', 'ΚΑΤΑΨΥΚΤΗΣ': 'Καταψύκτης', 'ΕΝ ΘΕΡΜΩ ΔΙΑΤΗΡΗΣΗ': 'Εν θερμώ διατήρηση', 'ΕΝ ΨΥΧΡΩ ΔΙΑΤΗΡΗΣΗ': 'Εν ψυχρώ διατήρηση', 'ΒΙΤΡΙΝΑ ΚΑΤΑΨΥΞΗΣ': 'Βιτρίνα κατάψυξης'})[t] || t; }

// ====================================================================== ποιος πελάτης (από τον σύνδεσμο του QR)
const Q = new URLSearchParams(location.search);
let P = Q.get('p') || LS.get('qr_p', ''), K = Q.get('k') || LS.get('qr_k', '');
if (Q.get('p') && Q.get('k')) { LS.set('qr_p', P); LS.set('qr_k', K); }
const START_DEVICE = Q.get('s');
// Τρόπος «ένα κινητό»: d = το κλειδί ΑΥΤΟΥ του κινητού (από την ενεργοποίηση). Μένει και στον σύνδεσμο,
// ώστε το εικονίδιο στην οθόνη (iPhone: άλλη αποθήκη από το Safari) να το έχει κι αυτό.
let D = Q.get('d') || LS.get('qr_d_' + P, '');
if (Q.get('d')) LS.set('qr_d_' + P, D);
const ACTIVATION = Q.get('e') || '';
function cleanUrl() {
  history.replaceState(history.state, '', location.pathname + '?p=' + encodeURIComponent(P) + '&k=' + encodeURIComponent(K) + (D ? '&d=' + encodeURIComponent(D) : ''));
}
if (P && K && (START_DEVICE || ACTIVATION || !Q.get('p'))) cleanUrl();
const KEY_STATE = 'qr_s_' + P, KEY_QUEUE = 'qr_q_' + P;

// Τρόπος «κάθε υπάλληλος»: Προμηθευτές / Προσωπικό / Υπογραφή ανοίγουν με PIN υπευθύνου.
// Οι λίστες ζουν ΜΟΝΟ στη μνήμη όσο είναι ξεκλείδωτο (ποτέ στη συσκευή) και ξανακλειδώνουν μετά από 5' χωρίς χρήση.
const LOCK_MIN = 5;
let UNL = null;              // {pin, until, promitheftes, prosopiko}
const locked = () => !!S && S.tropos !== 'ΕΝΑ' && !(UNL && UNL.until > Date.now());
const touchUnlock = () => { if (UNL) UNL.until = Date.now() + LOCK_MIN * 60000; };
const LOCKED_VIEWS = ['promitheftes', 'prom_form', 'prosopiko', 'pros_form', 'ypografi', 'rythmiseis'];

// ====================================================================== δεδομένα: ό,τι είπε ο server + ό,τι περιμένει να σταλεί
let base = LS.get(KEY_STATE, null);
let queue = LS.get(KEY_QUEUE, []);
let S = null, online = navigator.onLine, lastSync = LS.get('qr_sync_' + P, '');
let fatalError = '';

function rebuild() {
  if (!base) { S = null; return; }
  const st = clone(base), t = today();
  if (st.simera !== t) {            // η αποθηκευμένη εικόνα είναι από άλλη μέρα
    st.syskeves.forEach(s => s.simera = []);
    st.simera = t;
    st.kleisto_simera = kleistiJS(st.kleista, t);
  }
  if (st.tropos !== 'ΕΝΑ') {
    st.promitheftes = UNL && UNL.until > Date.now() ? clone(UNL.promitheftes) : null;
    st.prosopiko = UNL && UNL.until > Date.now() ? clone(UNL.prosopiko) : null;
  }
  queue.forEach(it => apply(st, it));
  st.katharismos.forEach(k => { k.egine = !!k.teleftaia && periodos(k.syxnotita, k.teleftaia.slice(0, 10)) === periodos(k.syxnotita, t); });
  S = st;
}

function apply(st, it) {
  if (it.typ === 'metrisi') {
    const s = st.syskeves.find(x => x.kod === it.s); if (!s) return;
    const m = {id: it.id, ts: it.ts, s: it.s, timi: Number(it.timi), apot: it.apot, orio: s.orio};
    if (!s.simera.some(x => x.id === m.id) && it.ts.slice(0, 10) === st.simera) s.simera.push(m);
    s.teleftaia = m;
    if (m.apot === 'ΕΝΤΟΣ') st.anoixtes = st.anoixtes.filter(a => a.s !== it.s || a.ts > it.ts);
    else if (!st.anoixtes.some(a => a.id === m.id)) st.anoixtes.push(Object.assign({energeies: [], kleisti: false}, m));
  } else if (it.typ === 'energeia') {
    const a = st.anoixtes.find(x => x.id === it.metrisi_id);
    if (a && !a.energeies.some(e => e.id === it.id)) a.energeies.push({id: it.id, ts: it.ts, energeia: it.energeia, sxolio: it.sxolio});
  } else if (it.typ === 'katharismos') {
    const k = st.katharismos.find(x => x.kod === it.simeio);
    if (k && (!k.teleftaia || it.ts > k.teleftaia)) k.teleftaia = it.ts;
  } else if (it.typ === 'promitheftis' || it.typ === 'prosopiko') {
    const list = it.typ === 'promitheftis' ? st.promitheftes : st.prosopiko;
    if (!list) return;                       // κλειδωμένο: η λίστα δεν είναι εδώ
    let o = list.find(x => x.id === it.id);
    if (!o) { o = {id: it.id}; list.push(o); }
    if (it.typ === 'promitheftis') Object.assign(o, {'ΕΠΩΝΥΜΙΑ': it.eponymia, 'ΑΦΜ': it.afm, 'ΔΟΥ': it.doy, 'ΔΙΕΥΘΥΝΣΗ': it.dieuthynsi, 'ΤΗΛΕΦΩΝΟ': it.til, 'ΕΙΔΗ': it.eidi});

/** Κλειστά μια μέρα; (ίδιος κανόνας με τον server: περίοδοι + σταθερές μέρες εβδομάδας) */
function kleistiJS(kl, day) {
  if (!kl) return null;
  for (const x of kl.periodoi || []) if (day >= x.apo && day <= x.eos) return x.per || 'Κλειστά';
  if ((kl.meres || []).includes(new Date(day + 'T12:00:00').getDay())) return 'Κλειστά (σταθερή μέρα)';
  return null;
}
/** Επίσημες αργίες (σταθερές + κινητές από το ορθόδοξο Πάσχα). */
function pasxa(y) {               // ορθόδοξο Πάσχα (Meeus, ιουλιανό + 13 μέρες, 1900–2099)
  const a = y % 4, b = y % 7, c = y % 19, d = (19 * c + 15) % 30, e = (2 * a + 4 * b - d + 34) % 7;
  const m = Math.floor((d + e + 114) / 31), dd = ((d + e + 114) % 31) + 1;
  const x = new Date(y, m - 1, dd); x.setDate(x.getDate() + 13); return x;
}
function argies(y) {
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const P0 = pasxa(y), mov = (n, t) => { const d = new Date(P0); d.setDate(d.getDate() + n); return [iso(d), t]; };
  return [[y + '-01-01', 'Πρωτοχρονιά'], [y + '-01-06', 'Θεοφάνεια'], mov(-48, 'Καθαρά Δευτέρα'), [y + '-03-25', '25η Μαρτίου'],
          mov(-2, 'Μεγάλη Παρασκευή'), mov(0, 'Κυριακή του Πάσχα'), mov(1, 'Δευτέρα του Πάσχα'), [y + '-05-01', 'Πρωτομαγιά'],
          mov(50, 'Αγίου Πνεύματος'), [y + '-08-15', 'Δεκαπενταύγουστος'], [y + '-10-28', '28η Οκτωβρίου'],
          [y + '-12-25', 'Χριστούγεννα'], [y + '-12-26', 'Σύναξη Θεοτόκου']].sort();
}

// ====================================================================== επικοινωνία με το Google
async function api(params, body) {
  let url = API, opt = {method: 'GET', cache: 'no-store', redirect: 'follow'};
  if (body) opt = {method: 'POST', body: JSON.stringify(body), headers: {'Content-Type': 'text/plain;charset=utf-8'}, redirect: 'follow'};
  else url += '?' + new URLSearchParams(params);
  let last;
  // Το Google δίνει πού και πού ένα προσωρινό σφάλμα· η επανάληψη είναι ασφαλής (κάθε εγγραφή έχει δικό της id).
  for (let i = 0; i < 4; i++) {
    const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 45000);
    try {
      const res = await fetch(url, Object.assign({signal: ctl.signal}, opt));
      clearTimeout(tm);
      if (res.ok) return await res.json();
      last = new Error('HTTP ' + res.status);
      if (![404, 429, 500, 502, 503].includes(res.status)) break;
    } catch (e) { clearTimeout(tm); last = e; if (!navigator.onLine) break; }
    await sleep(1500 * (i + 1));
  }
  throw last;
}

let flushing = false;
async function flush() {
  if (flushing || !queue.length || !P) return;
  flushing = true; drawSync();
  let sentLists = false;
  try {
    while (queue.length) {
      const batch = []; let size = 0;
      for (const it of queue) {
        const n = JSON.stringify(it).length;
        if (batch.length && (batch.length >= 15 || size + n > 3e6)) break;
        batch.push(it); size += n;
      }
      const r = await api(null, {action: 'apothikefsi', p: P, k: K, d: D, items: batch});
      if (!r.ok) { if (r.error === 'άκυρος σύνδεσμος' || r.error === 'μη καταχωρημένη συσκευή') { fatalError = r.error; render(); } throw new Error(r.error); }
      const sent = new Set(batch.map(b => b.id + '|' + (b.vid || '')));
      const errors = r.apotelesmata.filter(x => !x.ok).map(x => x.error);
      queue = queue.filter(it => !sent.has(it.id + '|' + (it.vid || '')));
      LS.set(KEY_QUEUE, queue);
      if (errors.length) toast('Δεν καταχωρήθηκε: ' + errors.join(', '), 'bad');
      online = true;
      if (batch.some(b => b.typ === 'promitheftis' || b.typ === 'prosopiko')) sentLists = true;
    }
    markSync();
    if (sentLists) { await refreshUnl(); rebuild(); if (['promitheftes', 'prosopiko', 'home'].includes(view.name)) render(); }
  } catch (e) { online = false; }
  finally { flushing = false; drawSync(); }
}

async function refresh() {
  if (!P) return;

    const r = await api({action: 'init', p: P, k: K, d: D});
    if (!r.ok) { fatalError = r.error || 'σφάλμα'; render(); return; }
    fatalError = '';
    if (r.tropos !== 'ΕΝΑ') { r.promitheftes = null; r.prosopiko = null; r.v = ''; r.myinco = ''; }   // ποτέ λίστες/κλειδί στη συσκευή όταν κλειδώνουν
    base = r; LS.set(KEY_STATE, base); online = true; markSync();
    await refreshUnl();
    rebuild();
    if (view.name === 'home' || view.name === 'thermokrasies' || view.name === 'katharismos' || view.name === 'promitheftes' || view.name === 'prosopiko') render();
    else drawSync();

}

// Android/Chrome: το κουμπί ανοίγει την επίσημη ερώτηση εγκατάστασης. iPhone: δεν επιτρέπεται αυτόματα → οδηγίες.
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view.name === 'home') render(); });

const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBox() {
  if (standalone() || LS.get('qr_installed', false)) return '';
  if (installEvt) return `<div class="install"><div><b>Βάλτε το QRecord στο κινητό</b><br><span class="muted">Ένα εικονίδιο στην οθόνη σας: το πατάτε και σκανάρετε.</span></div>
    <button class="btn" style="background:#287B9B;color:#fff" onclick="doInstall()">📲 Εγκατάσταση στο κινητό</button></div>`;
  if (isIOS()) return `<div class="install"><div><b>Βάλτε το QRecord στο iPhone</b><br><span class="muted">Ένα εικονίδιο στην οθόνη σας: το πατάτε και σκανάρετε.</span></div>
    <div>1. Πατήστε το κουμπί <b>Κοινοποίηση</b> <span aria-hidden="true">(το τετράγωνο με το βέλος ⬆)</span> κάτω στο Safari.<br>2. Επιλέξτε <b>«Προσθήκη στην οθόνη Αφετηρίας»</b>.</div></div>`;

}
async function doInstall() {

  installEvt.prompt();
  const r = await installEvt.userChoice.catch(() => null);
  installEvt = null;
  if (r && r.outcome === 'accepted') { LS.set('qr_installed', true); toast('✓ Το QRecord μπήκε στην οθόνη σας'); }
  render();
}

let buf = '';
function renderDevice() {

  shell(s.onoma, `

    <div class="display" id="disp"></div>
    <div class="keys">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="key('${n}')">${n}</button>`).join('')}
      <button onclick="key('±')" aria-label="Πρόσημο">±</button><button onclick="key('0')">0</button><button onclick="key(',')">,</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">
      <button class="btn sec" onclick="key('⌫')" aria-label="Σβήσιμο">⌫</button>
      <button class="btn go" id="save" onclick="saveMetrisi()">Αποθήκευση</button>
    </div>
    <div class="today"><span><b>Σήμερα ${Math.min(s.simera.length, fores(s))} από ${fores(s)} μετρήσεις</b>${todayList ? ':' : ''}</span>${todayList}</div>`);   // 23/10: 2 φορές την ημέρα
  drawDisp();
}
function key(k) {
  if (k === '⌫') buf = buf.slice(0, -1);
  else if (k === '±') buf = buf.startsWith('-') ? buf.slice(1) : '-' + buf;
  else if (k === ',') { if (!buf.includes(',')) buf = (buf === '' || buf === '-' ? buf + '0' : buf) + ','; }
  else {
    const digits = buf.replace('-', '').split(',');
    if (digits[1] !== undefined && digits[1].length >= 1) return;     // ένα δεκαδικό
    if (digits[1] === undefined && digits[0].length >= 3) return;
    buf = (buf === '0' ? '' : buf === '-0' ? '-' : buf) + k;
  }
  drawDisp();
}
function value() { const v = parseFloat(buf.replace(',', '.')); return isFinite(v) ? v : null; }
function drawDisp() {
  const el = $('#disp'); if (!el) return;
  const v = value();
  el.className = 'display' + (v === null ? ' empty' : '');
  el.innerHTML = (buf && buf !== '-' ? esc(buf.replace('-', '−')) : (buf === '-' ? '−' : '—')) + '<small>°C</small>';
  $('#save').disabled = v === null;
}
async function saveMetrisi() {

function certState(x) {
  const l = x['ΛΗΞΗ ΠΙΣΤΟΠΟΙΗΤΙΚΟΥ ΥΓΕΙΑΣ'];
  if (!l) return ['warn', 'Χωρίς ημερομηνία λήξης'];

  if (l < today()) return ['bad', 'Έληξε ' + ddmmyyyy(l)];

async function takeFoto(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    fotoData = await shrink(f, 1600, .72);
    const im = $('#fprev'); im.src = fotoData; im.hidden = false;
  } catch (e) { toast('Η φωτογραφία δεν διαβάστηκε', 'bad'); }
}
function shrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej; img.src = url;
  });
}
function savePerson(typ) {
  const v = id => ($('#' + id) ? $('#' + id).value.trim() : '');
  const it = {typ, id: view.id || newId(typ === 'promitheftis' ? 'PR' : 'PS'), vid: newId('V'), ts: now(), katastasi: v('kat') || 'ΕΝΕΡΓΟΣ'};
  if (typ === 'promitheftis') {
    Object.assign(it, {eponymia: v('ep'), afm: v('afm'), doy: v('doy'), dieuthynsi: v('di'), til: v('til'), eidi: v('eidi')});
    if (!it.eponymia) return toast('Συμπληρώστε την επωνυμία', 'bad');
    if (it.afm && !/^\d{9}$/.test(it.afm)) return toast('Ο ΑΦΜ έχει 9 ψηφία', 'bad');
  } else {
    Object.assign(it, {onoma: v('on'), thesi: v('th'), lixi: v('lx')});
    if (!it.onoma) return toast('Συμπληρώστε το ονοματεπώνυμο', 'bad');
  }
  if (fotoData) it.foto = fotoData;
  if (UNL) it.pin = UNL.pin;
  if (enqueue(it)) { toast('✓ Αποθηκεύτηκε'); back(); }
}

  const kth = r.katharismos.map(k => `<tr><td>${esc(k.xoros)}</td><td>${k.egine} από ${k.anamenomeno}</td></tr>`).join('');
  shell('Υπογραφή · ' + minasTitlos(m), `
    <p class="muted">Ελέγξτε τη σύνοψη του μήνα και υπογράψτε ως υπεύθυνος.</p>
    <h2>Θερμοκρασίες</h2>${devs || '<p class="muted">Καμία μέτρηση.</p>'}
    ${kth ? `<h2>Καθαρισμός</h2><div class="card" style="padding:4px 10px"><table class="sum">${kth}</table></div>` : ''}
    <h2>Υπογραφή υπευθύνου</h2>
    ${field('yon', 'Ονοματεπώνυμο υπευθύνου *', S.pelatis.ypefthynos)}
    <label class="f">Υπογράψτε με το δάχτυλο</label><canvas class="sig" id="sig"></canvas>
    <div style="display:flex;justify-content:flex-end;margin-top:6px"><button class="btn sec small" onclick="sigClear()">Σβήσιμο υπογραφής</button></div>
    <p class="muted" style="font-size:14px">Με την υπογραφή βεβαιώνω ότι έλεγξα τα αρχεία του μήνα ${minasTitlos(m)}.</p>
    <button class="btn wide go" onclick="saveYpografi('${m}')">Υπογραφή</button>`);
  sigInit();
}
let sigDirty = false;
function sigInit() {
  const c = $('#sig'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.6; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1b2533';
  g.fillStyle = '#fff'; g.fillRect(0, 0, r.width, r.height);
  sigDirty = false; let drawing = false;
  const pt = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pt(e)); };
  c.onpointermove = e => { if (!drawing) return; g.lineTo(...pt(e)); g.stroke(); sigDirty = true; };
  c.onpointerup = c.onpointercancel = () => { drawing = false; };
}
function sigClear() { sigInit(); }
function saveYpografi(m) {
  const on = $('#yon').value.trim();
  if (!on) return toast('Συμπληρώστε το ονοματεπώνυμο', 'bad');
  if (!sigDirty) return toast('Βάλτε την υπογραφή σας', 'bad');
  if (enqueue({typ: 'ypografi', id: newId('Y'), ts: now(), minas: m, onoma: on, eikona: $('#sig').toDataURL('image/png'), pin: UNL ? UNL.pin : ''})) {
    toast('✓ Ο μήνας υπογράφηκε'); go({name: 'home'}, true);
  }
}

// ====================================================================== σαρωτής QR μέσα στην εφαρμογή
// Android: BarcodeDetector του browser. iPhone: jsqr.js (αντίγραφο μέσα στην εφαρμογή, δουλεύει και χωρίς ίντερνετ).
function loadJsQR() {
  return window.jsQR ? Promise.resolve() : new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'jsqr.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
async function scan(fromDevice) {
  const el = document.createElement('div');
  el.className = 'scan';
  el.innerHTML = `<video playsinline muted autoplay></video><div class="frame"></div>
    <div class="bar"><div id="scanMsg">Στρέψτε την κάμερα στο QR της συσκευής</div>
    <button class="btn sec" id="scanClose">Κλείσιμο</button></div>`;
  document.body.appendChild(el);
  const video = $('video', el), msg = $('#scanMsg', el);
  let stream = null, stopped = false;
  const stop = () => { stopped = true; if (stream) stream.getTracks().forEach(t => t.stop()); el.remove(); };
  $('#scanClose', el).onclick = () => { stop(); if (fromDevice) back(); };
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: false});
  } catch (e) {
    stop();
    toast('Η κάμερα δεν άνοιξε. Δώστε άδεια για την κάμερα ή επιλέξτε τη συσκευή από τη λίστα.', 'bad');
    go({name: 'thermokrasies'}, !!fromDevice);
    return;
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  let detector = null;
  try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) detector = new BarcodeDetector({formats: ['qr_code']}); } catch (e) {}
  if (!detector) { try { await loadJsQR(); } catch (e) { msg.textContent = 'Ο σαρωτής δεν φόρτωσε. Κλείστε και επιλέξτε από τη λίστα.'; return; } }
  const cv = document.createElement('canvas'), g = cv.getContext('2d', {willReadFrequently: true});
  while (!stopped) {
    let text = '';
    try {
      if (video.readyState >= 2) {
        if (detector) { const r = await detector.detect(video); text = r[0] ? r[0].rawValue : ''; }
        else {
          const w = Math.min(640, video.videoWidth), h = Math.round(video.videoHeight * w / video.videoWidth);
          cv.width = w; cv.height = h; g.drawImage(video, 0, 0, w, h);
          const r = jsQR(g.getImageData(0, 0, w, h).data, w, h, {inversionAttempts: 'dontInvert'});
          text = r ? r.data : '';
        }
      }
    } catch (e) {}
    if (text) {
      let u = null; try { u = new URL(text); } catch (e) {}
      const qp = u ? u.searchParams.get('p') : null, qs = u ? u.searchParams.get('s') : null;
      if (!u || !qp) msg.textContent = 'Αυτό δεν είναι QR του QRecord';
      else if (kodN(qp) !== kodN(P)) msg.textContent = 'Αυτό το QR είναι άλλου καταστήματος';
      else if (!qs) { stop(); go({name: 'home'}, !!fromDevice); return; }
      else if (!S.syskeves.some(x => x.kod === kodN(qs))) msg.textContent = 'Η συσκευή δεν βρέθηκε. Ίσως αφαιρέθηκε.';
      else { if (navigator.vibrate) navigator.vibrate(60); stop(); go({name: 'device', s: kodN(qs)}, !!fromDevice); return; }
    }
    await sleep(250);
  }
}

// ====================================================================== διάλογοι
function ask(title, text, yes, no) {
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts">
      <button class="btn wide" data-v="1">${esc(yes)}</button>${no ? `<button class="btn wide sec" data-v="0">${esc(no)}</button>` : ''}</div></div>`;
    bg.onclick = e => { const v = e.target.dataset && e.target.dataset.v; if (v !== undefined || e.target === bg) { bg.remove(); res(v === '1'); } };
    document.body.appendChild(bg);
  });
}
let toastT;
function toast(msg, cls) {
  let el = $('.toast'); if (el) el.remove();
  el = document.createElement('div'); el.className = 'toast' + (cls ? ' ' + cls : ''); el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200);
}

// ====================================================================== ξεκίνημα
rebuild();
if (START_DEVICE && S && S.syskeves.some(x => x.kod === START_DEVICE)) { history.replaceState({name: 'home'}, '', location.search); go({name: 'device', s: START_DEVICE}); }
else { history.replaceState(view, '', location.search); render(); }

(async () => {
  if (ACTIVATION && P && K) { await sleep(300); await activate(); }
  await flush();
  await refresh();
  if (START_DEVICE && view.name === 'home' && S && S.syskeves.some(x => x.kod === START_DEVICE)) {
    history.replaceState({name: 'home'}, '', location.search); go({name: 'device', s: START_DEVICE});
  }
})();
window.addEventListener('online', () => { online = true; flush().then(refresh); });
window.addEventListener('offline', () => { online = false; drawSync(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush().then(refresh); });
setInterval(() => { if (queue.length) flush(); }, 30000);
setInterval(() => { if (view.name === 'home') render(); }, 60000);   // «ξαναμετρήστε τώρα» όταν περάσουν τα 30'
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
