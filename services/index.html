     Server: services/apps_script/Code.gs (όλα POST). Τα ραντεβού έρχονται ΚΑΤΕΥΘΕΙΑΝ από το Google Calendar.
     Αποφάσεις χρήστη: όνομα + ΔΙΚΟ PIN ο καθένας · ραντεβού ΑΝΑ ΑΤΟΜΟ, όχημα σε κάθε γραμμή, τα κοινά και στους δύο ·
     «Και οι δύο» ΜΟΝΟ ο ιδιοκτήτης · Waze για κάθε ραντεβού + «Διαδρομή ημέρας» σε Google Maps ·
     «Άνοιγμα Εντολής» = η υπάρχουσα φόρμα συνεργείου, γεμάτη (ο σύνδεσμος του ημερολογίου). -->
<style>
:root{--bg:#EEF6F9;--surface:#fff;--ink:#2D3A4D;--muted:#5B6B80;--line:#DCE8EE;--accent:#2DAFCE;--blue:#287B9B;--navy:#2D3A4D;
  --ok:#17875A;--bad:#C93030;--bad-bg:#FCE6E6;--warn:#8A5A00;--warn-bg:#FFF4DC;--key:#EAF2F6;--tag:#E3F3F8}
@media (prefers-color-scheme:dark){:root{--bg:#18212D;--surface:#212C3A;--ink:#EEF3F7;--muted:#A9B8C8;--line:#2F3D4E;
  --accent:#65C7D7;--blue:#65C7D7;--ok:#4CC38A;--bad:#FF7070;--bad-bg:#3D1E22;--warn:#F2C46D;--warn-bg:#3A2F17;--key:#2A3747;--tag:#20384A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.plate{background:#fff;border-radius:12px;display:inline-grid;place-items:center}

.hd .who b{display:block;font-size:15px;font-weight:800} .hd .who small{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.hd .ib{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;min-width:44px;font-size:19px}
/* ημέρα */

.dn button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;min-width:44px;font-size:20px;font-weight:800}

/* χρώματα όπως στο ημερολόγιο: ΑΡΧΙΜΗΔΗΣ μωβ · ΒΑΓΓΕΛΗΣ ΤΥΡΚΟΥΑΖ (Google colorId 7 «Peacock» #46D6DB — ο χρήστης 23/10:
   «ο Βαγγέλης έχει τυρκουάζ όχι μπλε») · μαζί μπλε · άλλος · αναβολή κίτρινο · ακύρωση απαλό κόκκινο */
:root{--t1:#7B4FB8;--t2:#46D6DB;--t9:#3F5FB0;--t10:#65C7D7;--anav:#F6BF26;--canc-bg:#FDECEA;--canc-fg:#C0392B}
.ri.t1,.kh.t1{background:var(--t1)} .ri.t2,.kh.t2{background:var(--t2)} .ri.t9,.kh.t9{background:var(--t9)} .ri.t10,.kh.t10{background:var(--t10)}

.seg button{flex:1;border:0;background:none;border-radius:10px;min-height:38px;font-weight:800;font-size:14.5px;color:var(--muted)}

.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;margin-top:16px;padding:6px 4px;border:0;border-bottom:2px solid var(--line);background:none;font-weight:800;font-size:15px;color:var(--ink);text-align:left}
.dh i{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap} .dh.to{border-bottom-color:var(--accent)} .dh.to>span{color:var(--blue)}
.st.mz{color:#fff;background:var(--t9)}

.mg button span{font-size:14px} .mg button i{font-style:normal;font-size:11.5px;background:var(--navy);color:#fff;border-radius:9px;min-width:20px;padding:1px 6px}

.ri{display:flex;gap:11px;align-items:center;width:100%;text-align:left;margin-top:9px;background:var(--surface);border:2px solid transparent;border-radius:15px;padding:11px 12px;box-shadow:0 3px 10px rgba(30,45,65,.06)}
.ri.sel{border-color:var(--accent)}

.ri .bd{flex:1;min-width:0}
.ri b{display:block;font-size:14.5px;font-weight:800;line-height:1.25}
.ri small{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.ri .tg{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
.ri em,.st{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--blue);background:var(--tag);border-radius:5px;padding:2px 7px}
.ri .ch{flex:none;font-size:24px;color:#9DB0C0}
.st.ak{color:var(--bad);background:var(--bad-bg)} .st.an{color:var(--warn);background:var(--warn-bg)}

.kh .tp{display:flex;align-items:center;gap:10px}

/* PIN */
.pinv{text-align:center;padding-top:10px}
.pinv .big img{height:120px} .pinv h2{margin:16px 0 4px;font-size:21px} .pinv p{margin:0;color:var(--muted);font-weight:600;font-size:14.5px}
.who2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.who2 button{border:1.5px solid var(--line);background:var(--surface);border-radius:22px;padding:10px 18px;font-weight:800;font-size:16px}
.who2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dots{display:flex;justify-content:center;gap:16px;margin:20px 0 6px;min-height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);display:block} .dots i.f{background:var(--ink)}
.err{color:var(--bad);font-weight:700;min-height:22px;font-size:14px;margin-top:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto}
.keys button{height:60px;border:0;border-radius:14px;background:var(--surface);font-size:24px;font-weight:700;box-shadow:0 2px 6px rgba(30,45,65,.08)}
.keys button:active{transform:scale(.97)} .keys .ok{background:var(--accent);color:#2D3A4D}
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;font-weight:800;font-size:16px;background:var(--ink);color:var(--bg);width:100%}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)} .btn.cy{background:var(--accent);color:#2D3A4D}
label.fl{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px;font-weight:700}
input.fi{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:17px}
.mbg{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}

.toast.bad{background:var(--bad);color:#fff}

<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbzLQ1kDECWA2B0I2yPG_SeR7I4YqIz4Gbc1Phdd090V5YmZIamAe7sV1acxwW5dwKH9AQ/exec';
const MERES = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
const AITIATIKI = {'ΒΑΓΓΕΛΗΣ': 'Βαγγέλη', 'ΑΡΧΙΜΗΔΗΣ': 'Αρχιμήδη'};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const simera = () => iso(new Date());
const imera = s => { const x = new Date(s + 'T12:00:00'); return MERES[x.getDay()] + ' ' + s.slice(8, 10) + '/' + s.slice(5, 7); };
const synList = r => String(r.syn || '').toUpperCase().split(/\s+/).filter(Boolean);
const wide = () => matchMedia('(min-width:900px)').matches;

// συνεδρία: μένει στη συσκευή μέχρι να λήξει (12 ώρες) ή να πατηθεί «Έξοδος»
let SESS = LS.get('srv_sess', null);       // {s, egw:{onoma,syn,idioktitis}}
let XR = [], D = null, DAY = simera(), FILTRO = null, SEL = null, view = {name: 'load'}, fortosi = null;
let MODE = LS.get('srv_mode', 'imera');   // imera | evdomada | minas

async function api(action, extra) {
  const body = JSON.stringify(Object.assign({action}, SESS && {s: SESS.s}, extra || {}));
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(API, {method: 'POST', body, headers: {'Content-Type': 'text/plain;charset=utf-8'}});
      const j = await r.json();
      if (j && j.exo) { exodos(true); throw new Error(j.error); }
      return j;
    } catch (e) {
      last = e;
      if (String(e.message || '').includes('έληξε')) throw e;
      await new Promise(r => setTimeout(r, 900 * (i + 1)));
    }
  }
  throw new Error(navigator.onLine === false ? 'Χρειάζεται σύνδεση στο ίντερνετ.' : 'Δεν απαντά ο server — δοκιμάστε ξανά.');
}
function toast(msg, bad) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function exodos(silent) {
  SESS = null; D = null; SEL = null; LS.del('srv_sess'); closeModal();
  view = {name: 'pin'}; if (!silent) render(); else render();
}

// ------------------------------------------------------------- εκκίνηση
async function start() {
  if (SESS) { view = {name: 'home'}; render(); return fortose(); }
  await fortoseXristes();
}
async function fortoseXristes() {
  view = {name: 'load'}; render();
  try {
    const r = await api('xristes');
    if (!r.ok) throw new Error(r.error || 'σφάλμα');
    XR = r.xristes;
    view = {name: 'pin', syn: LS.get('srv_last', (XR[0] || {}).syn)};
  } catch (e) { view = {name: 'msg', t: 'Δεν υπάρχει σύνδεση', m: e.message}; }
  render();
}

// ------------------------------------------------------------- είσοδος
let PIN = '', PIN1 = '';
const V = {};
V.load = () => '<div class="spin"></div>';

async function pinOk() {

  err.textContent = 'Έλεγχος…';

// ------------------------------------------------------------- ραντεβού
async function fortose(siopila) {
  if (fortosi) return fortosi;
  const [apo, eos] = evros();
  if (!siopila) { D = null; render(); }
  fortosi = (async () => {
    try {
      const r = await api('rantevou', {d: apo, eos});
      if (!r.ok) throw new Error(r.error);
      D = Object.assign(r, {day: DAY, apo, eos, pote: new Date()});
      SESS.egw = r.egw; LS.set('srv_sess', SESS);
      if (!FILTRO) FILTRO = r.egw.syn;
      if (SEL && !D.rantevou.find(x => x.id === SEL)) SEL = null;
    } catch (e) { if (!siopila) { D = {error: e.message}; } else toast(e.message, true); }
    fortosi = null; render();
  })();
  return fortosi;
}
// ------------------------------------------------------------- Ημέρα | Εβδομάδα | Μήνας
const MHNES = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
const prosthese = (s, n) => { const x = new Date(s + 'T12:00:00'); x.setDate(x.getDate() + n); return iso(x); };

const dm = s => s.slice(8, 10) + '/' + s.slice(5, 7);

  if (MODE === 'minas') { const a = DAY.slice(0, 8) + '01', x = new Date(a + 'T12:00:00'); x.setMonth(x.getMonth() + 1); x.setDate(0); return [a, iso(x)]; }
  return [DAY, DAY];
}
function mode(m) { MODE = m; LS.set('srv_mode', m); SEL = null; fortose(); }
function allaxeMera(n) {

function filtro(s) { FILTRO = s; render(); }
function pigaineMera(d) { DAY = d; MODE = 'imera'; LS.set('srv_mode', MODE); SEL = null; fortose(); }
// Ο ιδιοκτήτης στο κουμπί ΑΛΛΟΥ (π.χ. «Βαγγέλης») βλέπει ΜΟΝΟ όσα κάνει εκείνος μόνος του — τα κοινά είναι
// στο δικό του κουμπί και στο «Και οι δύο» (ο χρήστης 23/10). Ο τεχνικός βλέπει όπως πριν (και τα κοινά).
function monosTou(s) { return SESS.egw.idioktitis && s !== SESS.egw.syn && s !== 'OLOI'; }
function tou(r, s) { const l = synList(r); return monosTou(s) ? l.length === 1 && l[0] === s : l.includes(s); }
function orata() {
  if (!D || !D.rantevou) return [];

// κοινό ραντεβού = με πάνω από έναν (π.χ. «ΑΡΧΙΜΗΔΗΣ ΒΑΓΓΕΛΗΣ»)
const koino = r => synList(r).length > 1;
// ομάδα χρώματος όπως το InCo Calendar (KeOmada): 1 ΑΡΧΙΜΗΔΗΣ · 2 ΒΑΓΓΕΛΗΣ · 9 και οι δύο · 10 άλλος
function omada(r) {
  const s = synList(r), a = s.includes('ΑΡΧΙΜΗΔΗΣ'), v = s.includes('ΒΑΓΓΕΛΗΣ');

}
function xroma(r) { return r.katastasi === 'akyrosi' ? 'ak' : r.katastasi === 'anavoli' ? 'an' : 't' + omada(r); }
const chipXroma = s => s === 'ΑΡΧΙΜΗΔΗΣ' ? 'c1' : s === 'ΒΑΓΓΕΛΗΣ' ? 'c2' : s === 'OLOI' ? 'c9' : '';

function grammi(r) {

function diadromiUrl(list) {

  const tora = new Date().toTimeString().slice(0, 5);
  const st = list.filter(r => !r.katastasi && (DAY !== simera() || (r.eos || r.ora) > tora)).map(dieuthinsi).filter(Boolean);
  if (!st.length) return '';

function header() {

function lista() {

// Εβδομάδα: Δευτέρα–Παρασκευή πάντα· Σάββατο/Κυριακή ΜΟΝΟ αν έχουν ραντεβού (ο Βαγγέλης δεν δουλεύει Σάββατο)
function evdomada(list) {
  const d0 = deftera(DAY);
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = prosthese(d0, i), mesa = list.filter(r => r.mera === d);
    if (i >= 5 && !mesa.length) continue;
    const energa = mesa.filter(r => !r.katastasi);
    const mazi = FILTRO !== 'OLOI' && energa.some(koino);
    h += `<button class="dh${d === simera() ? ' to' : ''}" onclick="pigaineMera('${d}')"><span>${imera(d)}${d === simera() ? ' · σήμερα' : ''}</span>
      <i>${mazi ? '<span class="st mz">👥 ΜΑΖΙ</span> ' : ''}${energa.length ? energa.length + ' ραντεβού' : 'κανένα'}</i></button>`;

// Μήνας: πλέγμα με το ΠΛΗΘΟΣ ραντεβού ανά μέρα (όχι ποσά)· 👥 = μέρα που δουλεύουν μαζί· πάτημα = η μέρα

// ------------------------------------------------------------- φόρτωση οχήματος (βήμα 2, 23/10/2026)
// Χρειάζεται (υλικά των ραντεβού της ημέρας ΜΕ ΑΥΤΟ το όχημα, όποιος κι αν τα κάνει) · Έχει (απόθεμα από το ωριαίο
// Sync + φορτώσεις που δεν πέρασαν ακόμα) · πρόταση = όσο λείπει, με +/− και τσεκ. Καταχώρηση → φύλλο (ΝΕΑ) → Sync →
// ΑΠΟΘΕΜΑ_ΚΙΝΗΣΕΙΣ ως ΦΟΡΤΩΣΗ. Χωρίς ποσά/τιμές.
let FD = null, FOX = null, FQ = {}, FCHK = {}, FEXTRA = [];
const YLIKO_RE = /^\((\d+)\)\s*(.*?)(?:\s+x\s*([\d.,]+))?\s*$/i;
const vima = m => (String(m || '').toLowerCase().startsWith('τεμ') ? 1 : 10);
// «ΟΝΟΜΑ (κωδικός)» — ο κωδικός μόνο αν δεν είναι ήδη μέσα στο όνομα (π.χ. «ZAGOR WAX BLOCK (175)»)
const onomaKod = x => String(x.onoma || '').includes('(' + x.kod + ')') ? x.onoma : x.onoma + ' (' + x.kod + ')';
const fmt = (q, m) => (Math.round(q * 1000) / 1000).toLocaleString('el-GR') + (m ? ' ' + m : '');
function rantevouMeras() {
  if (!D || !D.rantevou) return [];
  return D.rantevou.filter(r => r.mera === DAY && !r.katastasi);
}
function oximataMeras() {
  const ox = [];
  rantevouMeras().forEach(r => { if (r.och && !ox.includes(r.och)) ox.push(r.och); });
  (FD && FD.apothema || []).forEach(a => { if (a.och && !ox.includes(a.och)) ox.push(a.och); });
  return ox;
}
function fortosiGrammes() {
  const kat = {}; (FD.ylika || []).forEach(y => kat[y.kod] = y);
  const g = {};
  const pare = kod => g[kod] || (g[kod] = {kod, onoma: (kat[kod] || {}).onoma || '', monada: (kat[kod] || {}).monada || '', need: 0, xoris: 0, pelates: 0, have: 0});
  rantevouMeras().filter(r => r.och === FOX).forEach(r => {
    String(r.aparait || '').split('\n').forEach(l => {
      const m = l.trim().match(YLIKO_RE);
      if (!m) return;
      const x = pare(m[1]);
      if (!x.onoma) x.onoma = m[2];
      x.pelates++;
      const q = m[3] ? Number(m[3].replace(',', '.')) : NaN;
      if (isFinite(q) && q > 0) x.need += q; else x.xoris++;
    });
  });
  FEXTRA.forEach(k => pare(k));
  (FD.apothema || []).filter(a => a.och === FOX && g[a.kod]).forEach(a => g[a.kod].have += a.ypol);
  (FD.fortoseis || []).filter(f => f.och === FOX && f.katastasi === 'ΝΕΑ' && g[f.kod]).forEach(f => g[f.kod].have += f.posotita);
  return Object.values(g).map(x => Object.assign(x, {protasi: x.need > x.have ? Math.ceil((x.need - x.have) * 1000) / 1000 : 0}))
    .sort((a, b) => (b.protasi > 0) - (a.protasi > 0) || a.onoma.localeCompare(b.onoma, 'el'));
}
async function anoixeFortosi() {
  FD = null; FQ = {}; FCHK = {}; FEXTRA = [];
  const mou = rantevouMeras().filter(r => synList(r).includes(SESS.egw.syn)).map(r => r.och).filter(Boolean);
  FOX = mou[0] || (rantevouMeras()[0] || {}).och || null;
  history.pushState({k: 1}, ''); view = {name: 'fortosi'}; render(); scrollTo(0, 0);
  try {
    const r = await api('fortosi_dedomena');
    if (!r.ok) throw new Error(r.error);
    FD = r; if (!FOX) FOX = oximataMeras()[0] || null;
  } catch (e) { FD = {error: e.message}; }
  render();
}
function dialexeOx(o) { FOX = o; FQ = {}; FCHK = {}; FEXTRA = []; render(); }
function posotita(x) { return FQ[x.kod] !== undefined ? FQ[x.kod] : x.protasi; }
function epilegmeno(x) { return FCHK[x.kod] !== undefined ? FCHK[x.kod] : x.protasi > 0; }
function allaxe(kod, d) {
  const x = fortosiGrammes().find(y => y.kod === kod); if (!x) return;
  const v = Math.max(0, Math.round((posotita(x) + d * vima(x.monada)) * 1000) / 1000);
  FQ[kod] = v; FCHK[kod] = v > 0; render();
}
function grapsePos(kod, el) { const v = Math.max(0, Number(String(el.value).replace(',', '.')) || 0); FQ[kod] = v; FCHK[kod] = v > 0; render(); }
function tsek(kod) { const x = fortosiGrammes().find(y => y.kod === kod); FCHK[kod] = !epilegmeno(x); render(); }
V.fortosi = () => {
  let h = `<div class="kh"><div class="tp"><button class="back" onclick="piso()" aria-label="Πίσω">‹</button>
    <small>ΦΟΡΤΩΣΗ ΟΧΗΜΑΤΟΣ · ${esc(imera(DAY))}</small></div><h2>🚚 ${esc(FOX || 'Όχημα')}</h2>
    <div class="ad">Τι χρειάζεται για τα ραντεβού της ημέρας, τι έχει ήδη το όχημα, και τι να φορτώσετε.</div></div>`;
  if (!FD) return h + '<div class="spin"></div>';
  if (FD.error) return h + `<div class="empty">${esc(FD.error)}<br><br><button class="btn sec" onclick="anoixeFortosi()">Ξανά</button></div>`;
  const ox = oximataMeras();
  if (ox.length > 1) h += `<div class="chips">${ox.map(o => `<button class="${o === FOX ? 'on' : ''}" onclick="dialexeOx('${esc(o)}')">${esc(o)}</button>`).join('')}</div>`;
  const G = fortosiGrammes(), n = G.filter(x => epilegmeno(x) && posotita(x) > 0).length;
  h += `<div class="upd" style="text-align:left">Απόθεμα οχήματος: ${FD.apothema_pote ? 'ενημέρωση ' + esc(FD.apothema_pote.slice(8, 10) + '/' + FD.apothema_pote.slice(5, 7) + ' ' + FD.apothema_pote.slice(11, 16)) : 'δεν έχει ενημερωθεί ακόμα'}</div>`;
  if (!G.length) h += '<div class="empty">Τα ραντεβού της ημέρας με αυτό το όχημα δεν έχουν υλικά.</div>';
  h += G.map(x => {
    const ok = x.need > 0 && x.have >= x.need && !x.xoris, q = posotita(x), on = epilegmeno(x) && q > 0;
    const anag = x.need > 0 ? fmt(x.need, x.monada) + (x.xoris ? ' (+' + x.xoris + ' χωρίς ποσότητα)' : '') : (x.xoris ? 'χωρίς ποσότητα' : '—');
    return `<div class="fr${on ? ' on' : ''}"><button class="ck" onclick="tsek('${esc(x.kod)}')" aria-label="Φορτώθηκε">${on ? '✓' : ''}</button>
      <div class="fb"><b>${esc(onomaKod(x))}</b>
      <small>Χρειάζεται <i>${esc(anag)}</i> · Έχει <i class="${x.have < 0 ? 'neg' : ''}">${esc(fmt(x.have, x.monada))}</i>${ok ? ' · <em class="ok">✓ αρκεί</em>' : ''}</small></div>
      <div class="st2"><button onclick="allaxe('${esc(x.kod)}',-1)" aria-label="Λιγότερο">−</button>
      <input inputmode="decimal" value="${esc(String(q).replace('.', ','))}" onchange="grapsePos('${esc(x.kod)}', this)" aria-label="Ποσότητα">
      <button onclick="allaxe('${esc(x.kod)}',1)" aria-label="Περισσότερο">+</button><span>${esc(x.monada)}</span></div></div>`;
  }).join('');
  h += `<button class="rte" onclick="alloYliko()">＋ Άλλο υλικό</button>
    <button class="go${n ? '' : ' off'}" style="width:100%;border:0" onclick="kataxorisi()">✓ Καταχώρηση φόρτωσης${n ? ' (' + n + ')' : ''}</button>`;
  const simera_ = (FD.fortoseis || []).filter(f => f.och === FOX);
  if (simera_.length) h += `<div class="cd"><div class="lb">ΦΟΡΤΩΘΗΚΑΝ ΣΗΜΕΡΑ</div>${simera_.map(f => `<div class="yl2"><span>${esc(onomaKod(f))}</span>
      <i>${esc(fmt(f.posotita, f.monada))}</i><em class="${f.katastasi === 'ΝΕΑ' ? 'wait' : f.katastasi === 'ΠΕΡΑΣΤΗΚΕ' ? 'ok' : 'bad'}">${f.katastasi === 'ΝΕΑ' ? '⏳ περιμένει Sync' : f.katastasi === 'ΠΕΡΑΣΤΗΚΕ' ? '✓ στην αποθήκη' : esc(f.katastasi)}</em></div>`).join('')}</div>`;
  return h;
};
function alloYliko() {
  openModal(`<h3 style="margin:0 0 6px">＋ Άλλο υλικό</h3><input class="fi" id="ys" placeholder="Όνομα ή κωδικός" oninput="alloFiltro(this.value)" autocomplete="off">
    <div id="yl" style="margin-top:8px;max-height:50vh;overflow:auto"></div><button class="lnk" onclick="closeModal()">Κλείσιμο</button>`);
  alloFiltro(''); setTimeout(() => { const i = $('#ys'); if (i) i.focus(); }, 50);
}
function alloFiltro(t) {
  const q = String(t || '').trim().toUpperCase();
  const L = (FD.ylika || []).filter(y => !q || y.onoma.toUpperCase().includes(q) || y.kod === q).slice(0, 40);
  $('#yl').innerHTML = L.map(y => `<button class="opt2" onclick="prostheseYliko('${esc(y.kod)}')"><b>${esc(y.onoma)}</b> <small>(${esc(y.kod)}) · ${esc(y.monada)}</small></button>`).join('') || '<div class="empty">Δεν βρέθηκε.</div>';
}
function prostheseYliko(kod) { if (!FEXTRA.includes(kod)) FEXTRA.push(kod); closeModal(); render(); }
function kataxorisi() {
  const L = fortosiGrammes().filter(x => epilegmeno(x) && posotita(x) > 0);
  if (!L.length) return;
  openModal(`<h3 style="margin:0 0 6px">Φόρτωση ${esc(FOX)}</h3><div class="sm" style="color:var(--muted);font-weight:700">Θα γραφτούν στην αποθήκη με το επόμενο Sync:</div>
    <div class="cd" style="box-shadow:none;border:1px solid var(--line)">${L.map(x => `<div class="yl2"><span>${esc(onomaKod(x))}</span><i>${esc(fmt(posotita(x), x.monada))}</i></div>`).join('')}</div>
    <div class="err" id="err"></div><button class="btn cy" id="kb" onclick="kataxorisiOk()">✓ Καταχώρηση</button><button class="lnk" onclick="closeModal()">Άκυρο</button>`);
}
async function kataxorisiOk() {
  const b = $('#kb'); b.disabled = true; b.textContent = 'Αποστολή…';
  const L = fortosiGrammes().filter(x => epilegmeno(x) && posotita(x) > 0);
  const batch = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  try {
    const r = await api('fortosi', {och: FOX, batch, items: L.map(x => ({kod: x.kod, onoma: x.onoma, posotita: posotita(x), monada: x.monada}))});
    if (!r.ok) throw new Error(r.error);
    FD = r; FQ = {}; FCHK = {}; FEXTRA = [];
    closeModal(); render(); toast('✓ Καταχωρήθηκε — περνά στην αποθήκη με το επόμενο Sync');
  } catch (e) { b.disabled = false; b.textContent = '✓ Καταχώρηση'; $('#err').textContent = e.message; }
}

// ------------------------------------------------------------- αλλαγή PIN
function allagiPin() {
  openModal(`<h3 style="margin:0 0 6px">🔑 Αλλαγή PIN</h3>
    <label class="fl">Τωρινό PIN</label><input class="fi" id="po" type="password" inputmode="numeric" maxlength="8">
    <label class="fl">Νέο PIN (4 έως 8 ψηφία)</label><input class="fi" id="p1" type="password" inputmode="numeric" maxlength="8">
    <label class="fl">Ξανά το νέο</label><input class="fi" id="p2" type="password" inputmode="numeric" maxlength="8">
    <div class="err" id="err"></div><button class="btn cy" onclick="allagiPinOk()">Αλλαγή</button><button class="lnk" onclick="closeModal()">Άκυρο</button>`);
}
async function allagiPinOk() {
  const po = $('#po').value, p1 = $('#p1').value, p2 = $('#p2').value, err = $('#err');
  if (!/^\d{4,8}$/.test(p1)) return err.textContent = 'Το PIN θέλει 4 έως 8 ψηφία.';
  if (p1 !== p2) return err.textContent = 'Τα δύο PIN δεν είναι ίδια.';
  try { const r = await api('allagi_pin', {pin: po, neo: p1}); if (!r.ok) return err.textContent = r.error; if (r.s) { SESS.s = r.s; LS.set('srv_sess', SESS); } closeModal(); toast('✓ Το PIN άλλαξε'); }
  catch (e) { err.textContent = e.message; }
}

// ------------------------------------------------------------- εγκατάσταση στη συσκευή
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (view.name === 'home') render(); });
addEventListener('appinstalled', () => { installEvt = null; LS.set('srv_installed', true); if (view.name === 'home') render(); });
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installBox() {
  if (standalone() || LS.get('srv_installed', false)) return '';
  if (installEvt) return `<div class="install"><div><b>Βάλτε το InCo Services στη συσκευή</b><br>Ένα εικονίδιο στην οθόνη — τα ραντεβού με ένα άγγιγμα.</div>
    <button class="btn" style="background:var(--blue);color:#fff" onclick="doInstall()">📲 Εγκατάσταση</button></div>`;
  if (isIOS()) return `<div class="install"><div><b>Βάλτε το InCo Services στο iPhone/iPad</b></div>
    <div>1. Πατήστε <b>Κοινοποίηση</b> (⬆) στο Safari.<br>2. Επιλέξτε <b>«Προσθήκη στην οθόνη Αφετηρίας»</b>.</div></div>`;
  return '';
}
async function doInstall() {
  if (!installEvt) return;
  installEvt.prompt();
  const r = await installEvt.userChoice.catch(() => null);
  installEvt = null;
  if (r && r.outcome === 'accepted') { LS.set('srv_installed', true); toast('✓ Μπήκε στην οθόνη σας'); }
  render();
}

// ------------------------------------------------------------- σχεδίαση
function render() {
  if ((view.name === 'home' || view.name === 'kartela' || view.name === 'fortosi') && !SESS) view = {name: 'pin'};
  const two = view.name === 'home' && wide() && D && D.rantevou;
  $('#app').className = 'wrap' + (two ? ' two' : '');
  $('#app').innerHTML = (V[view.name] || V.load)();
}
function openModal(html) { closeModal(); const bg = document.createElement('div'); bg.className = 'mbg'; bg.id = 'mbg';
  bg.innerHTML = `<div class="mod" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg); }
function closeModal() { const m = $('#mbg'); if (m) m.remove(); }
// ανανέωση: κάθε 5 λεπτά όσο είναι ανοιχτή + όταν ξαναγυρίζει μπροστά
setInterval(() => { if (SESS && !document.hidden && view.name !== 'pin') fortose(true); }, 5 * 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && SESS && D && D.pote && Date.now() - D.pote.getTime() > 60000) {
    if (DAY !== simera() && D.day === DAY && Date.now() - D.pote.getTime() > 6 * 3600000) DAY = simera();
    fortose(true);
  }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
