<head>

<!-- My InCo — εφαρμογή κινητού του υπευθύνου (23/10/2026). Server: myinco/apps_script/Code.gs (όλα POST).
     Αποφάσεις χρήστη: κάθετο λογότυπο · ΔΙΚΟ PIN κάθε υπεύθυνος · τμήματα ανά ΥΠΗΡΕΣΙΑ με το σήμα τους
     (Pest Control = γενικό InCo · Water Safety = Hotelier · «Επιχειρήσεις Υγειονομικού Ενδιαφέροντος» ΟΛΟΚΛΗΡΟ) ·
     σήμα ΕΙΔΟΥΣ πελάτη στην κεφαλίδα (σκάφος/ξενοδοχείο-Airbnb/ΚΥΕ) · αχνά μόνο όσα ταιριάζουν, με
     «Ζητήστε πληροφορίες / πρόταση» · ξανακλείδωμα σε 5' · ενημέρωση ημερήσια/εβδομαδιαία/μηνιαία ανά υπεύθυνο. -->
<style>
:root{--bg:#EEF6F9;--surface:#fff;--ink:#2D3A4D;--muted:#5B6B80;--line:#DCE8EE;--accent:#2DAFCE;--blue:#287B9B;--navy:#2D3A4D;
  --ok:#17875A;--ok-bg:#E2F4EB;--bad:#C93030;--bad-bg:#FCE6E6;--key:#EAF2F6;--live:#E3F3F8}
@media (prefers-color-scheme:dark){:root{--bg:#18212D;--surface:#212C3A;--ink:#EEF3F7;--muted:#A9B8C8;--line:#2F3D4E;
  --accent:#65C7D7;--blue:#65C7D7;--ok:#4CC38A;--ok-bg:#163428;--bad:#FF7070;--bad-bg:#3D1E22;--key:#2A3747;--live:#20384A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit} button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.plate{background:#fff;border-radius:12px;display:grid;place-items:center}
/* κεφαλίδα: κάθετο λογότυπο · όνομα · σήμα είδους πελάτη */
.hd{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 2px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.hd .mi{flex:none;height:64px;padding:4px 6px}
.hd .mi img{height:56px;display:block}
.hd .who{flex:1;min-width:0}
.hd .who b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.hd .who small{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.hd .bd{flex:none;width:54px;height:64px;padding:4px}
.hd .bd img{max-width:100%;max-height:56px}
.hd .back{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:44px;min-width:44px;font-size:22px}
.hi{padding:10px 4px 2px;font-size:14px;font-weight:700;color:var(--muted)}
.t{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:11px 12px;margin-top:10px;box-shadow:0 4px 14px rgba(30,45,65,.07)}
.t .lg{flex:none;width:62px;height:70px;padding:4px}
.t .lg img{max-width:100%;max-height:62px}
.t .lg.fo{background:var(--key);color:var(--blue);font-size:28px}
.t h5{margin:0;font-size:16.5px;font-weight:800;line-height:1.25}
.t p{margin:3px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.t .ch{margin-left:auto;flex:none;font-size:26px;color:#9DB0C0}
.t.ax{background:transparent;box-shadow:none;border:2px dashed #B9CBD6}
.t.ax .lg,.t.ax h5,.t.ax p{opacity:.45}
.t.ax .zp{margin-left:auto;flex:none;font-size:11px;font-weight:800;color:var(--blue);text-align:right;line-height:1.25}
.sep{margin:20px 6px 0;font-size:11px;font-weight:800;letter-spacing:1.4px;color:#8EA0B3}
.lnk{display:block;margin:16px auto 0;background:none;border:0;color:var(--blue);font-weight:800;font-size:15px}
/* τμήμα */
.sh{display:flex;gap:12px;align-items:center;color:#fff;border-radius:0 0 22px 22px;margin:0 -14px 4px;padding:calc(14px + env(safe-area-inset-top)) 16px 16px}
.sh .pl{flex:none;width:66px;height:76px;padding:5px} .sh .pl img{max-width:100%;max-height:66px}
.sh b{display:block;font-size:19px;font-weight:800;line-height:1.2} .sh small{display:block;font-size:12.5px;font-weight:700;opacity:.85;margin-top:3px}
.sh .back{flex:none;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;height:44px;min-width:44px;font-size:22px}
.cd{background:var(--surface);border-radius:16px;padding:13px 15px;margin-top:12px;box-shadow:0 4px 14px rgba(30,45,65,.07)}
.lb{font-size:11.5px;font-weight:800;letter-spacing:1.3px;color:var(--blue)}
.bg{font-size:19px;font-weight:800;margin-top:4px}
.sm{font-size:13px;font-weight:700;color:var(--muted);margin-top:3px}
.tlx{display:flex;gap:6px;margin-top:10px} .tlx i{flex:1;height:10px;border-radius:6px;background:var(--line);display:block}
.tlx i.d{background:var(--ok)} .tlx i.n{background:var(--accent)}
.f{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.f:first-of-type{border-top:0}
.f .ic{flex:none;width:54px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--blue);background:var(--live)}
.f .tx{flex:1;min-width:0} .f b{display:block;font-size:14.5px;font-weight:800} .f small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.f .ch{flex:none;color:#9DB0C0;font-size:22px}
.btn{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:800;font-size:16.5px;background:var(--ink);color:var(--bg);width:100%}
.btn.cy{background:var(--accent);color:#2D3A4D} .btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:42px;font-size:14.5px;width:auto} .btn:disabled{opacity:.45}
.empty{padding:16px 4px;color:var(--muted);font-size:14px;font-weight:600;text-align:center}
/* PIN */
.pinv{text-align:center;padding-top:6px}
.pinv h2{margin:18px 0 4px;font-size:21px} .pinv p{margin:0;color:var(--muted);font-weight:600;font-size:14.5px}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 6px;min-height:22px}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);display:block} .dots i.f{background:var(--ink)}
.err{color:var(--bad);font-weight:700;min-height:22px;font-size:14px;margin-top:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.keys button{height:60px;border:0;border-radius:14px;background:var(--surface);font-size:24px;font-weight:700;box-shadow:0 2px 6px rgba(30,45,65,.08)}
.keys button:active{transform:scale(.97)} .keys .ok{background:var(--accent);color:#2D3A4D}
label.fl{display:block;font-size:13.5px;color:var(--muted);margin:14px 0 6px;font-weight:700;text-align:left}
input.fi{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font-size:17px}
/* φύλλο από κάτω */
.mbg{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.5);display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.mod .mh{display:flex;gap:12px;align-items:center}
.mod .mh .pl{flex:none;width:62px;height:72px;padding:4px} .mod .mh .pl img{max-width:100%;max-height:64px}
.mod .mh b{font-size:17px;font-weight:800;line-height:1.25} .mod .mh small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.mod ul{margin:14px 0 0;padding-left:20px;font-weight:700;font-size:14.5px;line-height:1.55}
.qrc{margin-top:14px;display:flex;gap:12px;align-items:center;border:2px solid var(--accent);border-radius:16px;padding:10px 12px}
.qrc img{flex:none;width:52px;height:52px;border-radius:12px} .qrc b{display:block;font-size:16px} .qrc small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.nt{margin-top:8px;text-align:center;font-size:12.5px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:#fff}
.install{margin-top:16px;padding:14px;border-radius:16px;border:2px dashed var(--blue);background:var(--surface);display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.install b{color:var(--blue)}
.foot{display:flex;gap:8px;margin-top:22px}
.foot .btn{flex:1}
.row2{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px solid var(--line)} .row2:first-child{border-top:0}
.row2 .tx{flex:1;min-width:0} .row2 b{display:block;font-size:15px} .row2 small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.opt{display:flex;align-items:center;gap:12px;padding:13px;border:1.5px solid var(--line);border-radius:14px;margin-top:8px;background:var(--surface);width:100%;text-align:left;font-weight:700}
.opt i{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--muted);flex:none;display:block} .opt.on{border-color:var(--ink)} .opt.on i{border:7px solid var(--ink)}
.code{font-size:34px;font-weight:800;letter-spacing:.25em;text-align:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.spin{margin:60px auto;width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.qrb{margin-top:12px;border-radius:18px;background:linear-gradient(135deg,#2D3A4D,#287B9B 55%,#2DAFCE);color:#fff;padding:14px 16px;display:flex;gap:14px;align-items:center}
.qrb .qi{flex:none;width:56px;height:56px;border-radius:14px;background:#fff;padding:3px} .qrb .qi img{width:100%;height:100%;border-radius:11px}
.qrb b{display:block;font-size:19px;font-weight:800} .qrb small{display:block;font-size:13.5px;font-weight:600;opacity:.95;margin-top:3px}
.wsr{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1.5px solid var(--line)} .cd .lb + .wsr{border-top:0}
.wsr span{flex:1;min-width:0} .wsr b{display:block;font-size:14.5px} .wsr small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.wsr em{flex:none;font-style:normal;font-size:11.5px;font-weight:800;border-radius:6px;padding:3px 8px}
.wsr em.ok{color:var(--ok);background:var(--ok-bg)} .wsr em.yp{color:var(--bad);background:var(--bad-bg)} .wsr em.pe{color:var(--muted);background:var(--key)}
.neo{flex:none;font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:2px 6px}
.act{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.act .btn{min-height:50px;font-size:15px}
/* «My InCo» μέσα σε κείμενο = η ΛΕΞΗ-ΛΟΓΟΤΥΠΟ, ποτέ γράμματα (κανόνας χρήστη· λευκή πλακέτα για το σκοτεινό θέμα) */
.miw{height:1.05em;width:auto;vertical-align:-.24em;background:#fff;padding:1px 5px;border-radius:5px}
/* γλώσσα ΕΛ / EN */
.lg2{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex:none}
.lg2 button{border:0;background:none;padding:7px 11px;font-size:13px;font-weight:800;color:var(--muted);min-width:44px;min-height:38px}
.lg2 button.on{background:var(--ink);color:var(--bg)}
.lgr{display:flex;justify-content:flex-end;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycby4Rzp8F7Xic29ynWjMkIZRHIYciQ49YqWHQR0A6dO4DvH-9FhAP6ROsl6BObeQEZfz/exec';
const LOCK_MIN = 5;
const MI = '<img class="miw" src="word.png" alt="My InCo">';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

// ------------------------------------------------------------- γλώσσα (24/10/2026, ζήτησε ο χρήστης): ελληνικά / English
// Ανά συσκευή (localStorage). Πρώτη φορά: η γλώσσα του κινητού (ελληνικό κινητό → ελληνικά, αλλιώς English).
// Μεταφράζονται τα κείμενα της εφαρμογής + οι σταθερές λέξεις που έρχονται από τον server (ομάδες, είδη, λάθη).
// Ονόματα πελατών/εγγράφων μένουν όπως είναι.
let LANG = LS.get('mi_lang', '') || (/^el/i.test(navigator.language || '') ? 'el' : 'en');
const L = (el, en) => LANG === 'en' ? en : el;
const EN = {
  // ομάδες εγγράφων
  'ΠΙΣΤΟΠΟΙΗΤΙΚΑ & ΕΚΘΕΣΕΙΣ': 'CERTIFICATES & REPORTS', 'ΕΝΤΥΠΑ ΜΥΟΚΤΟΝΙΑΣ & ΕΝΤΟΜΟΠΑΓΙΔΩΝ': 'RODENT & INSECT TRAP FORMS', 'ΚΑΤΟΨΕΙΣ': 'FLOOR PLANS',
  'ΑΔΕΙΕΣ & MSDS': 'LICENCES & MSDS', 'ΑΠΟΤΕΛΕΣΜΑΤΑ': 'RESULTS', 'ΔΕΙΓΜΑΤΟΛΗΨΙΕΣ': 'SAMPLINGS',
  'ΚΑΤΟΨΕΙΣ — ΣΗΜΕΙΑ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ': 'FLOOR PLANS — SAMPLING POINTS', 'ΕΓΓΡΑΦΑ': 'DOCUMENTS', 'ΜΗΝΙΑΙΑ': 'MONTHLY',
  'ΠΡΟΜΗΘΕΥΤΕΣ': 'SUPPLIERS', 'ΠΡΟΣΩΠΙΚΟ': 'STAFF',
  // υπότιτλοι & ονόματα εγγράφων/πινάκων
  'έντυπο μυοκτονίας': 'rodent control form', 'έντυπο εντομοπαγίδων': 'insect trap form', 'κάτοψη': 'floor plan', 'άδεια σκευάσματος': 'product licence', 'άδεια εταιρείας': 'company licence',
  'Ηλεκτρικές εντομοπαγίδες': 'Electric insect traps', 'Μυοκτονία': 'Rodent control', 'Φερομονικές παγίδες': 'Pheromone traps',
  'Απεντόμωση': 'Insect control', 'Πρόγραμμα εφαρμογών': 'Treatment schedule',
  // Water Safety
  'Πόσιμο νερό': 'Drinking water', 'Κολυμβητική δεξαμενή': 'Swimming pool', 'Επιφάνειες': 'Surfaces',
  // είδος πελάτη / περιοχή
  'ΚΑΤΑΣΤΗΜΑ': 'BRANCH',
  // λάθη του server
  'το έγγραφο δεν βρέθηκε': 'Document not found.', 'λείπουν στοιχεία': 'Missing details.',
  'υπάρχει ήδη υπεύθυνος — ζητήστε του κωδικό πρόσκλησης': 'There is already a manager — ask them for an invitation code.',
  'γράψτε το όνομά σας': 'Please enter your name.', 'γράψτε το όνομα': 'Please enter the name.',
  'το PIN θέλει 4 έως 8 ψηφία': 'The PIN needs 4 to 8 digits.',
  'πολλές λάθος προσπάθειες — δοκιμάστε σε 15 λεπτά': 'Too many wrong attempts — try again in 15 minutes.',
  'λάθος ή ληγμένος κωδικός πρόσκλησης': 'Wrong or expired invitation code.',
  'αυτό το PIN το έχει άλλος υπεύθυνος — διαλέξτε άλλο': 'Another manager uses this PIN — choose a different one.',
  'λάθος PIN': 'Wrong PIN', 'λάθος τωρινό PIN': 'Wrong current PIN.', 'άγνωστη συχνότητα': 'Unknown frequency.',
  'μη έγκυρο email': 'Invalid email.', 'μόνο ο διαχειριστής προσθέτει υπεύθυνους': 'Only the administrator can add managers.',
  'μόνο ο διαχειριστής': 'Administrator only.', 'δεν μπορείτε να αφαιρέσετε τον εαυτό σας': 'You cannot remove yourself.',
  'δεν βρέθηκε': 'Not found.', 'άγνωστο τμήμα': 'Unknown service.', 'άκυρος σύνδεσμος': 'Invalid link.',
  'η πρόσβαση έχει κλείσει — επικοινωνήστε με την InCo': 'Access has been closed — please contact InCo.',
  'η σύνδεση έληξε — βάλτε ξανά το PIN': 'Your session expired — enter your PIN again.',
  'άκυρο αίτημα': 'Invalid request.', 'άγνωστη ενέργεια': 'Unknown action.'
};
const tr = s => LANG === 'en' && s != null && EN[String(s).trim()] ? EN[String(s).trim()] : s;
function glossa(g) {
  LANG = g; LS.set('mi_lang', g); document.documentElement.lang = g;
  MERES = g === 'en' ? ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] : ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
  TM.PC.axno = L('απεντόμωση · μυοκτονία', 'insect & rodent control');
  TM.PC.lista = [L('Απεντόμωση και μυοκτονία με πρόγραμμα επισκέψεων', 'Insect and rodent control with a visit schedule'),
                 L('Ζωντανοί πίνακες καταγραφών', 'Live record tables'), L('Πιστοποιητικό σε κάθε εφαρμογή', 'Certificate for every treatment')];
  TM.WS.axno = L('Legionella · νερό', 'Legionella · water');
  TM.WS.lista = [L('Δειγματοληψίες Legionella', 'Legionella sampling'), L('Αποτελέσματα εργαστηρίου', 'Laboratory results'),
                 L('Μελέτη αξιολόγησης κινδύνου', 'Risk assessment study')];
  TM.EYE.titlos = L('Επιχειρήσεις Υγειονομικού Ενδιαφέροντος', 'Food Safety & Hygiene');
  TM.EYE.axno = L('QRecord · χωρίς χαρτιά', 'QRecord · paperless');
  TM.EYE.lista = [L('Συμβουλευτικές υπηρεσίες', 'Consulting services'), L('Εκπαίδευση προσωπικού (ΕΦΕΤ)', 'Staff training (EFET)')];
  SYXN = [['ΗΜΕΡΗΣΙΑ', L('Κάθε μέρα', 'Every day')], ['ΕΒΔΟΜΑΔΙΑΙΑ', L('Μία φορά την εβδομάδα', 'Once a week')], ['ΜΗΝΙΑΙΑ', L('Μία φορά τον μήνα', 'Once a month')]];
}
function allagiGlossas(g) { if (g === LANG) return; glossa(g); closeModal(); render(); glossaServer(); }
// η γλώσσα πάει και στον server: σε αυτή έρχονται τα email ενημέρωσης του υπευθύνου (24/10)
function glossaServer() { if (SESS && D && D.ego && D.ego.glossa !== LANG) api('rythmisi', {glossa: LANG}).then(r => { if (r.ok && D) D.ego.glossa = LANG; }).catch(() => {}); }
// το κουμπάκι ΕΛ / EN (πάνω δεξιά στις οθόνες εισόδου, και στις Ρυθμίσεις)
const glossaBtn = () => `<div class="lg2">${[['el', 'ΕΛ'], ['en', 'EN']].map(([g, t]) =>
  `<button class="${LANG === g ? 'on' : ''}" onclick="allagiGlossas('${g}')" aria-label="${g === 'el' ? 'Ελληνικά' : 'English'}">${t}</button>`).join('')}</div>`;

const TM = {
  PC:  {titlos: 'Pest Control', logo: 'pc.png', xroma: '#2D3A4D'},
  WS:  {titlos: 'Water Safety', logo: 'ws.png', xroma: '#287B9B'},

async function api(action, extra) {
  const body = JSON.stringify(Object.assign({action, p: P, k: K}, SESS && {s: SESS.s}, extra || {}));
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(API, {method: 'POST', body, headers: {'Content-Type': 'text/plain;charset=utf-8'}});
      const j = await r.json();
      if (j && j.error) j.error = tr(j.error);
      if (j && j.session) { kleidoma(); const er = new Error(j.error); er.session = true; throw er; }
      return j;
    } catch (e) { last = e; if (e.session) throw e; await new Promise(r => setTimeout(r, 900 * (i + 1))); }
  }
  throw new Error(navigator.onLine === false ? L('Χρειάζεται σύνδεση στο ίντερνετ.', 'An internet connection is needed.')
    : L('Δεν απαντά ο server — δοκιμάστε ξανά.', 'The server is not responding — please try again.'));
}
function toast(msg, bad, html) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); if (html) t.innerHTML = msg; else t.textContent = msg;

}

const QR_API = 'https://script.google.com/macros/s/AKfycbwRoyNlK_CkIEShRA3_hVUpeTT117EprA1xdvi9ZWrvh5w0r-8B2mVLDPnp8_cSGyx9qA/exec';

(() => { const c = SS.get('mi_qr_' + P); const d = new Date(); if (c && c.sim === d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')) QR_SIMERA = Object.assign(c, {t: 0}); })();          // {t, sim, apo, ektos, anoixtes, ws} — κρατιέται 2' για να μη ρωτάει σε κάθε οθόνη
function qrKarta() {
  const q = D.qrecord, x = QR_SIMERA;
  const ekt = n => L(n + ' εκτός ορίου', n + ' out of limit');
  const st = x && x.kleisto && !x.egin ? `🔒 ${L('Σήμερα κλειστά', 'Closed today')} · ${esc(x.kleisto)}` : x ? `${L(`Σήμερα ${x.egin} από ${x.ola} μετρήσεις`, `Today ${x.egin} of ${x.ola} readings`)} · ${x.ektos ? `<span style="color:#FFD2D2;font-weight:800">${ekt(x.ektos)}${x.anoixtes ? ' — ' + x.anoixtes + L(' ανοιχτ' + (x.anoixtes === 1 ? 'ή' : 'ές'), ' open') : ''}</span>` : ekt(0)}` : L('φόρτωση…', 'loading…');
  return `<div class="qrb"><span class="qi"><img src="qrecord.png" alt=""></span><div style="flex:1;min-width:0"><b>QRecord</b><small id="qrst">${st}</small></div></div>
    <div class="cd"><div class="lb">${L('ΑΡΧΕΙΑ ΤΕΚΜΗΡΙΩΣΗΣ', 'RECORDS')}</div>
    <button class="f" onclick="anoixe('../qrecord/arxeio.html?' + new URLSearchParams({p: D.qrecord.p, v: D.qrecord.v}))"><span class="ic">LIVE</span>
      <span class="tx"><b>${L('Όλες οι καταγραφές', 'All records')}</b><small>${L('θερμοκρασίες, καθαρισμοί, ενέργειες — ανά μήνα', 'temperatures, cleaning, actions — by month')}</small></span><span class="ch">›</span></button>
    ${q.tropos !== 'ΕΝΑ' && q.k ? `<button class="f" onclick="anoixe('../qrecord/?' + new URLSearchParams({p: D.qrecord.p, k: D.qrecord.k}))"><span class="ic" style="color:var(--navy)">QR</span>
      <span class="tx"><b>${L('Άνοιγμα QRecord', 'Open QRecord')}</b><small>${L('για καταγραφή από αυτό το κινητό', 'to record from this phone')}</small></span><span class="ch">›</span></button>` : ''}</div>`;
}
async function qrSimera() {
  if (QR_SIMERA && Date.now() - QR_SIMERA.t < 120000) return QR_SIMERA;
  const q = D.qrecord, d = new Date(), pad = n => String(n).padStart(2, '0');
  const m = d.getFullYear() + '-' + pad(d.getMonth() + 1), sim = m + '-' + pad(d.getDate());
  let egin = 0, ola = 0, ektos = 0, anoixtes = 0, kleisto = '';
  if (q.tropos !== 'ΕΝΑ' && q.k) {
    // γρήγορη «σημερινή» κλήση (~2× πιο γρήγορη από τον μήνα)· οι επαναμετρήσεις (epan) δεν μετράνε ως 2η μέτρηση
    const r = await (await fetch(QR_API + '?' + new URLSearchParams({action: 'init', p: q.p, k: q.k}))).json();
    if (!r.ok) throw new Error(r.error || 'QRecord');
    (r.syskeves || []).forEach(s => {
      const n = s.ana_imera || 2, sm = (s.simera || []);
      ola += n; egin += Math.min(n, sm.filter(x => !x.epan).length); ektos += sm.filter(x => x.apot === 'ΕΚΤΟΣ').length;
    });
    anoixtes = (r.anoixtes || []).length;
    if (r.kleisto_simera) kleisto = r.kleisto_simera;      // 23/10: δηλωμένη κλειστή μέρα
  } else {          // «ένα κινητό»: το κινητό του υπευθύνου δεν είναι καταχωρημένο → ο μήνας με το κλειδί ανάγνωσης
    const r = await (await fetch(QR_API + '?' + new URLSearchParams({action: 'arxeio', p: q.p, v: q.v, m}))).json();
    if (!r.ok) throw new Error(r.error || 'QRecord');
    (r.syskeves || []).forEach(s => {
      ola += s.ana_imera || 2;
      egin += Math.min(s.ana_imera || 2, (s.metriseis || []).filter(x => (x.ts || '').slice(0, 10) === sim).length);
      (s.apokliseis || []).forEach(a => { if ((a.ts || '').slice(0, 10) === sim) ektos++; if (!a.kleisti) anoixtes++; });
    });
  }
  QR_SIMERA = {t: Date.now(), egin, ola, ektos, anoixtes, sim, kleisto};
  SS.set('mi_qr_' + P, QR_SIMERA);
  return QR_SIMERA;
}
async function qrFortose() {
  try { await qrSimera(); const el = $('#qrst'); if (el && view.name === 'tmima') { const tmp = document.createElement('div'); tmp.innerHTML = qrKarta(); el.innerHTML = $('#qrst', tmp).innerHTML; } }
  catch (e) { const el = $('#qrst'); if (el) el.textContent = L('δεν φορτώθηκε η σημερινή εικόνα', 'today\'s status could not be loaded'); }
}

let PDFJS = null;
const CACHE_EGG = {};
function fortoseScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function pdfjs() {
  if (!PDFJS) { await fortoseScript('pdfjs/pdf.min.js'); PDFJS = window.pdfjsLib; PDFJS.GlobalWorkerOptions.workerSrc = 'pdfjs/pdf.worker.min.js'; }
  return PDFJS;
}
V.egg = () => {
  const a = (D.arxeia || []).find(x => x.id === view.arg) || {n: L('Έγγραφο', 'Document')};
  setTimeout(() => provoli(view.arg), 0);
  return `<div class="hd"><button class="back" onclick="view.apo ? go(view.apo.name, view.apo.arg) : go('home')" aria-label="${L('Πίσω', 'Back')}">‹</button>
    <div class="who"><b>${esc(tr(a.n))}</b><small>${esc([tr(a.y), dmy(a.d)].filter(Boolean).join(' · '))}</small></div></div>
    <div id="pv"><div class="spin"></div></div><div style="height:84px"></div>
    <div class="act"><button class="btn sec" id="b1" disabled>${L('Κοινοποίηση / Εκτύπωση', 'Share / Print')}</button><button class="btn cy" id="b2" disabled>${L('Αποθήκευση', 'Save')}</button></div>`;
};
async function provoli(id) {
  const pv = $('#pv');
  try {
    let e = CACHE_EGG[id];
    if (!e) {
      const r = await api('arxeio', {id});
      if (!r.ok) throw new Error(r.error);
      const bin = atob(r.b64), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      e = CACHE_EGG[id] = {u8, mime: r.mime, arxeio: r.arxeio};
    }
    if (view.name !== 'egg' || view.arg !== id) return;
    const file = new File([e.u8], e.arxeio, {type: e.mime});
    const url = URL.createObjectURL(file);
    if (/^image\//.test(e.mime)) pv.innerHTML = `<img src="${url}" alt="" style="width:100%;border-radius:10px;background:#fff">`;
    else {
      const lib = await pdfjs(), doc = await lib.getDocument({data: e.u8.slice()}).promise;
      pv.innerHTML = '';
      const w = pv.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n), v1 = page.getViewport({scale: 1}), vp = page.getViewport({scale: w / v1.width * dpr});
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        c.style.cssText = 'width:100%;display:block;margin:0 0 10px;border-radius:6px;background:#fff;box-shadow:0 3px 12px rgba(20,30,45,.12)';
        pv.appendChild(c);
        await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
        if (view.name !== 'egg') return;
      }
    }
    const b1 = $('#b1'), b2 = $('#b2');
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      b1.disabled = false; b1.onclick = () => navigator.share({files: [file], title: e.arxeio}).catch(() => {});
    } else { b1.textContent = L('Άνοιγμα / Εκτύπωση', 'Open / Print'); b1.disabled = false; b1.onclick = () => anoixe(url); }
    b2.disabled = false; b2.onclick = () => { const l = document.createElement('a'); l.href = url; l.download = e.arxeio; document.body.appendChild(l); l.click(); l.remove(); };
  } catch (err) {
    pv.innerHTML = `<div class="empty">${L('Δεν άνοιξε', 'Could not open')}: ${esc(err.message)}</div>`;
  }
}

  if (standalone() || LS.get('mi_installed', false)) return '';
  const ena = L('Ένα εικονίδιο στην οθόνη σας — όλα τα έγγραφα με ένα άγγιγμα.', 'An icon on your home screen — all documents with one tap.');
  if (installEvt) return `<div class="install"><div><b>${L('Βάλτε το ' + MI + ' στο κινητό', 'Add ' + MI + ' to your phone')}</b><br>${ena}</div>
    <button class="btn" style="background:var(--blue);color:#fff" onclick="doInstall()">📲 ${L('Εγκατάσταση στο κινητό', 'Install on phone')}</button></div>`;
  if (isIOS()) return `<div class="install"><div><b>${L('Βάλτε το ' + MI + ' στο iPhone', 'Add ' + MI + ' to your iPhone')}</b><br>${ena}</div>
    <div>${L('1. Πατήστε <b>Κοινοποίηση</b> (το τετράγωνο με το βέλος ⬆) κάτω στο Safari.<br>2. Επιλέξτε <b>«Προσθήκη στην οθόνη Αφετηρίας»</b>.',
             '1. Tap <b>Share</b> (the square with the arrow ⬆) at the bottom of Safari.<br>2. Choose <b>“Add to Home Screen”</b>.')}</div></div>`;
  return '';
}
async function doInstall() {
  if (!installEvt) return;
  installEvt.prompt();
  const r = await installEvt.userChoice.catch(() => null);
  installEvt = null;
  if (r && r.outcome === 'accepted') { LS.set('mi_installed', true); toast(L('✓ Το ' + MI + ' μπήκε στην οθόνη σας', '✓ ' + MI + ' was added to your home screen'), false, true); }
  render();
}

function go(name, arg) { const apo = view.name !== 'egg' ? {name: view.name, arg: view.arg} : view.apo; view = {name, arg, apo}; render(); scrollTo(0, 0); }

}
function openModal(html) { closeModal(); const bg = document.createElement('div'); bg.className = 'mbg'; bg.id = 'mbg';
  bg.innerHTML = `<div class="mod" role="dialog" aria-modal="true">${html}</div>`; bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg); }
function closeModal() { const m = $('#mbg'); if (m) m.remove(); }
addEventListener('popstate', () => { if (view.name !== 'home' && D) { view = {name: 'home'}; render(); } });

body:has(.act) #incoEkdosi{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
</style>
<div id="incoEkdosi"></div>
<script>
(function () {
  var el = document.getElementById('incoEkdosi');
  var t = new Date(document.lastModified);
  if (!el || isNaN(t)) return;
  function p(n) { return (n < 10 ? '0' : '') + n; }
  function morfi(d) {
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' · ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  el.textContent = 'έκδ. ' + morfi(t);
  var vrethike = false;
  function elegxos() {
    if (vrethike || !navigator.onLine || location.protocol.indexOf('http') !== 0) return;
    fetch(location.href.split('#')[0], { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var s = new Date(r.headers.get('Last-Modified') || '');
      if (isNaN(s) || s - t < 60000) return;
      vrethike = true;
      el.innerHTML = '<a href="#">⚠ έκδ. ' + morfi(t) +
        ' — υπάρχει νεότερη: πάτα για ανανέωση</a>';
      el.firstChild.onclick = function (e) { e.preventDefault(); location.reload(); };
    }).catch(function () {});
  }
  setTimeout(elegxos, 4000);
  setInterval(elegxos, 30 * 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) elegxos(); });
})();
</script>
