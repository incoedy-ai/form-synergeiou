<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πλάνο δειγματοληψίας Legionella</title>
<style>
:root{--navy:#2D3A4D;--blue:#287B9B;--cyan:#2DAFCE;--sky:#6FB7D6;--bg:#f0f2f5;--line:#dde5ec;--red:#C62828;--green:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Verdana,Arial,sans-serif;font-size:14px;background:var(--bg);color:#222}
.head{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
.head img{height:56px;width:auto;background:#fff;border-radius:6px;padding:3px;flex:none}
.head h1{font-size:17px;letter-spacing:.4px}
.head .sub{font-size:12px;opacity:.85;margin-top:5px}
.stripe{height:4px;background:linear-gradient(90deg,var(--sky),var(--cyan))}
.wrap{max-width:1040px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px;overflow:hidden}
.card h2{background:var(--blue);color:#fff;font-size:12.5px;padding:9px 14px;letter-spacing:.4px;
         display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:normal;opacity:.9;font-size:11.5px}
.body{padding:12px 14px}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{flex:1;min-width:150px;background:#f7fafc;border-left:4px solid var(--cyan);border-radius:6px;padding:10px 12px}
.tile .l{font-size:11px;color:#778;text-transform:uppercase}
.tile .v{font-size:19px;font-weight:bold;color:var(--navy);margin-top:3px}
.ok{color:var(--green)} .bad{color:var(--red)}
.bar{height:7px;border-radius:4px;background:#e7edf2;overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--cyan)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#eef3f7;color:var(--navy);text-align:left;padding:6px 8px;font-size:11px;
   border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f2f5f8}
td.c,th.c{text-align:center}
tr.orofos td{background:var(--navy);color:#fff;font-weight:bold;font-size:11.5px;letter-spacing:.3px}
tr.orofos td span{float:right;font-weight:normal;opacity:.9}
tr.pote td{background:#fff7f7}
tr.pote td.nm{color:var(--red)}
td.nm{font-weight:bold;color:var(--navy);white-space:nowrap}
td.nm small{display:block;font-weight:normal;color:#8a99a8;font-size:11px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--green)}
.none{color:#d6dee5}
.tel{font-weight:bold;color:var(--navy)}
/* --- η δεύτερη όψη: κουτάκια (ο χρήστης θα διαλέξει ποια βολεύει) --- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.pt{border:1px solid var(--line);border-left:5px solid #cfd8e0;border-radius:6px;padding:8px 10px;background:#fbfdff}
.pt.egine{border-left-color:var(--green);background:#f6fbf7}
.pt.pote{border-left-color:var(--red);background:#fff7f7}
.pt .nm{font-weight:bold;color:var(--navy);font-size:13px}
.pt .kt{font-size:11.5px;margin-top:3px;color:#667}
.pt.pote .kt{color:var(--red);font-weight:bold}
.pt .kt.palies{color:#8a99a8;font-size:11px}
.opsi{display:flex;gap:8px;margin-bottom:12px}
.opsi button{border:1px solid var(--line);background:#fff;color:var(--navy);font-family:inherit;
             font-weight:bold;font-size:12.5px;border-radius:6px;padding:9px 16px;cursor:pointer}
.opsi button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.foot{font-size:11px;color:#778;padding:10px 14px}
.empty{padding:16px;color:#889}
.deigma{background:#FFF4CE;border-bottom:1px solid #E6D9A2;color:#5b4b12;
        font-size:12px;padding:8px 20px;text-align:center}
.mini{font-size:11.5px;color:#556;margin-top:6px}
a.link{color:var(--blue)}
</style></head><body>
<div class="head"><img src="hotelier.jpg" alt="InCo Hotelier Services">
  <div><h1 id="titlos">ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ — LEGIONELLA</h1>
  <div class="sub">Πίνακας διαρκούς ενημέρωσης καταγραφών · InCo — Εφαρμογές Δημόσιας Υγείας</div></div></div>
<div class="stripe"></div>
<div class="wrap" id="wrap"><div class="card"><div class="empty" id="katastasi">Φόρτωση δεδομένων…</div></div></div>

<script>
// ---------------------------------------------------------------------------
// ΓΕΝΙΚΟ ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ — ΜΟΝΟ λεγεωνέλλα (ρητό χρήστη 23/09/2026):
// «πού έχουν γίνει δειγματοληψίες και πού δεν έχουν γίνει».
// Ομαδοποίηση ΑΝΑ ΟΡΟΦΟ (επιλογή του χρήστη). Ο όροφος βγαίνει από τον αριθμό
// δωματίου (101 -> 1ος). Όπου η αρίθμηση δεν έχει όροφο (δωμάτια 1..Ν) μπαίνουν
// όλα μαζί ως «ΔΩΜΑΤΙΑ»· τα SPA/κουζίνες/υπόγεια πάνε στους «ΚΟΙΝΟΧΡΗΣΤΟΥΣ ΧΩΡΟΥΣ».
// ---------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const SCRIPT = P.get('script'), KOD = P.get('kod'), PELATIS = P.get('pelatis') || '';
// ΔΕΙΓΜΑ: αληθινά νούμερα, αλλαγμένο όνομα — για να δείχνουμε τη σελίδα σε τρίτους
// χωρίς να φεύγουν στοιχεία πελάτη. ⚠️ ΜΟΝΟ με ρητό ?demo=1, ποτέ ως εφεδρεία.
const DEMO = P.get('demo') === '1';
const KATAGRAFES = 'katagrafes.html' + location.search;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const el = document.getElementById('wrap');
const minas = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
if (DEMO) {
  const t = document.createElement('div');
  t.className = 'deigma';
  t.textContent = 'ΔΕΙΓΜΑ ΠΑΡΟΥΣΙΑΣΗΣ — η εγκατάσταση εμφανίζεται με πλαστό όνομα· ' +
                  'δεν αντιστοιχεί σε συγκεκριμένο πελάτη.';
  document.querySelector('.stripe').after(t);
}
if (PELATIS) document.getElementById('titlos').textContent = 'ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ LEGIONELLA — ' + PELATIS;

function arithmos(xoros){
  const m = String(xoros || '').toUpperCase().match(/ΔΩΜΑΤ[ΙΕ]?[ΟI]\s*#?\s*(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

// ⚠️ Ο αριθμός ΟΠΩΣ ΤΟΝ ΓΡΑΦΕΙ ΤΟ ΞΕΝΟΔΟΧΕΙΟ: «001», όχι «1» (ρητό χρήστη 23/09/2026
// — «001 002 στο συγκεκριμένο ξενοδοχείο»). Χρησιμοποιείται στο εύρος του ορόφου.
function arithmosKeimeno(xoros){
  const m = String(xoros || '').toUpperCase().match(/ΔΩΜΑΤ[ΙΕ]?[ΟI]\s*#?\s*(\d+)/);
  return m ? m[1] : null;
}

function render(d){
  let sim = d.simeia || [];
  const ep = d.episkepseis || [], met = d.metriseis || [];
  const leg = ep.filter(x => x['ΕΙΔΟΣ'] === 'LEGIONELLA');
  if (!sim.length) {
    el.innerHTML = '<div class="card"><h2>ΠΛΑΝΟ</h2><div class="empty">Δεν έχουν καταγραφεί ' +
      'ακόμη σημεία δειγματοληψίας για την εγκατάσταση.</div></div>';
    return;
  }
  const legIds = {}; leg.forEach(x => legIds[x['ΕΠΙΣΚΕΨΗ_ID']] = x['ΗΜΕΡΟΜΗΝΙΑ']);
  // πότε δειγματίστηκε κάθε σημείο (μόνο λεγεωνέλλα)
  const imer = {};
  met.forEach(x => {
    const d2 = legIds[x['ΕΠΙΣΚΕΨΗ_ID']];
    if (!d2 || !x['ΣΗΜΕΙΟ_ID']) return;
    (imer[x['ΣΗΜΕΙΟ_ID']] = imer[x['ΣΗΜΕΙΟ_ID']] || {})[d2] = 1;
  });

  // ⚠️ ΜΟΝΟ σημεία λεγεωνέλλας: όσα έχουν δείγμα λεγεωνέλλας, και όσα δεν έχουν
  // δειγματιστεί ΠΟΤΕ (αυτά είναι τα δωμάτια του πλάνου που περιμένουν σειρά).
  // Σημεία που υπάρχουν μόνο για πόσιμο/swab/κολυμβητική δεν ανήκουν εδώ.
  const alla = {};
  met.forEach(x => { if (x['ΣΗΜΕΙΟ_ID'] && !legIds[x['ΕΠΙΣΚΕΨΗ_ID']]) alla[x['ΣΗΜΕΙΟ_ID']] = 1; });
  sim = sim.filter(s => imer[s['ΣΗΜΕΙΟ_ID']] || !alla[s['ΣΗΜΕΙΟ_ID']]);

  const exei3psifia = sim.some(s => (arithmos(s['ΧΩΡΟΣ']) || 0) >= 100);
  const omades = {};
  sim.forEach(s => {
    const x = String(s['ΧΩΡΟΣ'] || '').toUpperCase();
    const n = arithmos(s['ΧΩΡΟΣ']);
    let g;
    // ⚠️ Το SPA είναι ΣΤΟ ΥΠΟΓΕΙΟ, ξεχωριστός χώρος — όχι ισόγειο (ρητό χρήστη
    // 23/09/2026). Τα «SPA ΝΤΟΥΣ ΔΩΜΑΤΙΟ 1ο» έχουν αριθμό μέσα τους και αλλιώς θα
    // έπεφταν λάθος στον 1ο όροφο ή στο ισόγειο.
    // Το JACUZZI ανήκει στο SPA, άρα και αυτό στο υπόγειο (ρητό χρήστη 23/09/2026).
    if (x.indexOf('SPA') >= 0 || x.indexOf('ΥΠΟΓΕΙ') >= 0 || x.indexOf('JACUZZI') >= 0 ||
        x.indexOf('ΤΖΑΚΟΥΖ') >= 0) g = 'ΥΠΟΓΕΙΟ · SPA';
    else if (n === null) g = 'ΚΟΙΝΟΧΡΗΣΤΟΙ ΧΩΡΟΙ';
    else if (!exei3psifia) g = 'ΔΩΜΑΤΙΑ';
    else if (n < 100) g = 'ΙΣΟΓΕΙΟ';
    else g = Math.floor(n / 100) + 'ος ΟΡΟΦΟΣ';
    (omades[g] = omades[g] || []).push(s);
  });
  const seira = Object.keys(omades).sort((a, b) => {
    const f = x => x === 'ΥΠΟΓΕΙΟ · SPA' ? -2 : (x === 'ΔΩΜΑΤΙΑ' ? -1 :
              (x === 'ΙΣΟΓΕΙΟ' ? 0 :
              (x === 'ΚΟΙΝΟΧΡΗΣΤΟΙ ΧΩΡΟΙ' ? 999 : parseInt(x, 10))));
    return f(a) - f(b);
  });

  const synolo = sim.length;
  const eginan = sim.filter(s => imer[s['ΣΗΜΕΙΟ_ID']]).length;
  const teleftaia = leg.map(x => x['ΗΜΕΡΟΜΗΝΙΑ']).sort().pop();
  let html = '<div class="card"><div class="body"><div class="tiles">' +
    '<div class="tile"><div class="l">Σημεία στο πλάνο</div><div class="v">' + synolo + '</div></div>' +
    '<div class="tile"><div class="l">Έχουν ελεγχθεί</div><div class="v ok">' + eginan + '</div></div>' +
    '<div class="tile"><div class="l">Δεν έχουν ελεγχθεί ποτέ</div><div class="v bad">' +
      (synolo - eginan) + '</div></div>' +
    (teleftaia ? '<div class="tile"><div class="l">Τελευταία δειγματοληψία</div><div class="v">' +
      minas(teleftaia) + '</div></div>' : '') +
    '</div><div class="bar"><span style="width:' + Math.round(eginan * 100 / synolo) + '%"></span></div>' +
    '<div class="mini">Κάλυψη δικτύου ' + Math.round(eginan * 100 / synolo) + '% · τα σημεία ' +
    'εναλλάσσονται σε κάθε δειγματοληψία ώστε με τον χρόνο να ελεγχθούν όλα.</div></div></div>';

  // ⚠️ ΔΥΟ ΟΨΕΙΣ, ο χρήστης διαλέγει: «δεν ξέρω τι είναι πιο βολικό οπτικά· με τα
  // κουτάκια απέφυγα πολύ διάβασμα» (23/09/2026). Πίνακας με κουκκίδες ή κουτάκια.
  // Η επιλογή θυμάται στον browser του καθενός.
  const stiles = leg.slice().sort((a, b) => a['ΗΜΕΡΟΜΗΝΙΑ'] < b['ΗΜΕΡΟΜΗΝΙΑ'] ? -1 : 1);

  function omada(g){
    const lista = omades[g].slice().sort((a, b) =>
      (arithmos(a['ΧΩΡΟΣ']) || 9999) - (arithmos(b['ΧΩΡΟΣ']) || 9999) ||
      String(a['ΧΩΡΟΣ']).localeCompare(String(b['ΧΩΡΟΣ']), 'el'));
    const nums = lista.map(s => ({ n: arithmos(s['ΧΩΡΟΣ']), t: arithmosKeimeno(s['ΧΩΡΟΣ']) }))
                      .filter(x => x.n !== null).sort((a, b) => a.n - b.n).map(x => x.t);
    const arithmitiko = /ΟΡΟΦΟΣ|ΙΣΟΓΕΙΟ|ΔΩΜΑΤΙΑ/.test(g);
    return { lista: lista,
             n_ok: lista.filter(s => imer[s['ΣΗΜΕΙΟ_ID']]).length,
             evros: (arithmitiko && nums.length) ? ' (' + (nums[0] === nums[nums.length - 1] ? nums[0]
                    : nums[0] + '–' + nums[nums.length - 1]) + ')' : '' };
  }
  function onomaSimeiou(s){
    return String(s['ΧΩΡΟΣ'] || '').replace(/^ΔΩΜΑΤ[ΙΕ]?[ΟI]\s*/i, 'Δωμάτιο ');
  }

  // --- όψη Α: ένας πίνακας, στήλη ανά δειγματοληψία, κουκκίδα όπου πάρθηκε δείγμα
  let pin = '<div class="card"><h2>ΠΛΑΝΟ ΑΝΑ ΣΗΜΕΙΟ<small>' + stiles.length +
            ' δειγματοληψίες λεγεωνέλλας</small></h2><div class="body"><div class="scroll">' +
            '<table><tr><th>Σημείο</th>' +
            stiles.map(x => '<th class="c">' + minas(x['ΗΜΕΡΟΜΗΝΙΑ']).slice(3) + '</th>').join('') +
            '<th class="c">Φορές</th></tr>';
  seira.forEach(g => {
    const o = omada(g);
    pin += '<tr class="orofos"><td colspan="' + (stiles.length + 2) + '">' + esc(g) + o.evros +
           '<span>ελέγχθηκαν ' + o.n_ok + ' από ' + o.lista.length + '</span></td></tr>';
    o.lista.forEach(s => {
      const dates = imer[s['ΣΗΜΕΙΟ_ID']] || {};
      const n = Object.keys(dates).length;
      pin += '<tr' + (n ? '' : ' class="pote"') + '><td class="nm">' +
             (+s['ΚΡΙΣΙΜΟ'] ? '★ ' : '') + esc(onomaSimeiou(s)) +
             (s['ΣΗΜΕΙΟ'] ? '<small>' + esc(s['ΣΗΜΕΙΟ']) + '</small>' : '') + '</td>' +
             stiles.map(x => '<td class="c">' + (dates[x['ΗΜΕΡΟΜΗΝΙΑ']]
               ? '<span class="dot"></span>' : '<span class="none">·</span>') + '</td>').join('') +
             '<td class="c ' + (n ? 'tel' : 'none') + '">' + (n || '—') + '</td></tr>';
    });
  });
  pin += '</table></div></div></div>';

  // --- όψη Β: κουτάκια ανά όροφο (λιγότερο διάβασμα)
  let kout = '';
  seira.forEach(g => {
    const o = omada(g);
    let mesa = '<div class="grid">';
    o.lista.forEach(s => {
      const dates = Object.keys(imer[s['ΣΗΜΕΙΟ_ID']] || {}).sort();
      mesa += '<div class="pt ' + (dates.length ? 'egine' : 'pote') + '">' +
              (+s['ΚΡΙΣΙΜΟ'] ? '<span style="float:right">★</span>' : '') +
              '<div class="nm">' + esc(onomaSimeiou(s)) + '</div>' +
              '<div class="kt">' + (dates.length
                ? '✓ ' + minas(dates[dates.length - 1]) +
                  (dates.length > 1 ? ' · ' + dates.length + ' φορές' : '')
                : 'δεν έχει ελεγχθεί') + '</div>' +
              (dates.length > 1 ? '<div class="kt palies">' +
                 dates.slice(0, -1).reverse().map(minas).join(' · ') + '</div>' : '') +
              (s['ΣΗΜΕΙΟ'] ? '<div class="kt">' + esc(s['ΣΗΜΕΙΟ']) + '</div>' : '') + '</div>';
    });
    kout += '<div class="card"><h2>' + esc(g) + o.evros + '<small>ελέγχθηκαν ' + o.n_ok +
            ' από ' + o.lista.length + '</small></h2><div class="body">' + mesa + '</div></div></div>';
  });

  html += '<div class="opsi"><button id="bPin">Πίνακας με κουκκίδες</button>' +
          '<button id="bKout">Κουτάκια</button></div>' +
          '<div id="opsiPin">' + pin + '</div><div id="opsiKout">' + kout + '</div>';

  html += '<div class="foot" style="text-align:center">Κάθε στήλη είναι μία δειγματοληψία· ' +
          'η κουκκίδα σημαίνει ότι πάρθηκε δείγμα από εκείνο το σημείο. Με κόκκινο φόντο ' +
          'όσα δεν έχουν ελεγχθεί ποτέ · ★ κρίσιμο σημείο. <a class="link" href="' + KATAGRAFES + '">Δες τις ' +
          'δειγματοληψίες και τα αποτελέσματα →</a><br>Ενημερώθηκε ' +
          new Date().toLocaleString('el-GR') + ' · InCo — Δελφών 140, Γλυφάδα · 210 9644310</div>';
  el.innerHTML = html;

  function deixe(poia){
    document.getElementById('opsiPin').style.display = poia === 'pinakas' ? '' : 'none';
    document.getElementById('opsiKout').style.display = poia === 'pinakas' ? 'none' : '';
    document.getElementById('bPin').className = poia === 'pinakas' ? 'on' : '';
    document.getElementById('bKout').className = poia === 'pinakas' ? '' : 'on';
    try { localStorage.setItem('ws_plano_opsi', poia); } catch (e) {}
  }
  document.getElementById('bPin').onclick = function(){ deixe('pinakas'); };
  document.getElementById('bKout').onclick = function(){ deixe('koutakia'); };
  let proti = 'pinakas';
  try { proti = localStorage.getItem('ws_plano_opsi') || 'pinakas'; } catch (e) {}
  deixe(proti);
}

if (DEMO) {
  // Το δείγμα είναι ΣΤΑΤΙΚΟ αρχείο δίπλα στη σελίδα — δεν χτυπάει καθόλου τη βάση.
  fetch('deigma.json?t=' + Date.now())
    .then(r => r.json())
    .then(d => { document.getElementById('titlos').textContent =
                   'ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ LEGIONELLA — ' + (d.pelatis || 'ΔΕΙΓΜΑ'); render(d); })
    .catch(e => { document.getElementById('katastasi').textContent =
                   'Δεν φορτώθηκε το δείγμα (' + e.message + ').'; });
} else if (!SCRIPT || !KOD) {
  document.getElementById('katastasi').textContent =
    'Ο σύνδεσμος δεν είναι πλήρης — λείπει ο πελάτης. Ζήτησέ μας καινούργιο σύνδεσμο.';
} else {
  // ⚠️ Το Google απαντά κάπου-κάπου 404 στην πρώτη κλήση — τρεις προσπάθειες.
  (function fortose(p){
    fetch(SCRIPT + '?action=katagrafes&kod=' + encodeURIComponent(KOD) + '&t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => { if (d && d.ok) render(d); else throw new Error((d && d.error) || 'άγνωστο'); })
      .catch(e => {
        if (p < 3) { document.getElementById('katastasi').textContent =
            'Φόρτωση δεδομένων… (προσπάθεια ' + (p + 1) + ')';
          setTimeout(function(){ fortose(p + 1); }, 2500); return; }
        document.getElementById('katastasi').textContent =
          'Δεν φορτώθηκαν τα δεδομένα (' + e.message + '). Δοκίμασε ξανά σε λίγο.';
      });
  })(1);
}
</script>
</body></html>
