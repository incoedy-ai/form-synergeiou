<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Συγκεντρωτικά Water Safety</title>
<style>
:root{--navy:#2D3A4D;--blue:#287B9B;--cyan:#2DAFCE;--sky:#6FB7D6;--bg:#f0f2f5;--line:#dde5ec;--red:#C62828;--green:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Verdana,Arial,sans-serif;font-size:14px;background:var(--bg);color:#222}
.head{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
.head img{height:56px;width:auto;background:#fff;border-radius:6px;padding:3px;flex:none}
.head h1{font-size:17px;letter-spacing:.4px}
.head .sub{font-size:12px;opacity:.85;margin-top:5px}
.stripe{height:4px;background:linear-gradient(90deg,var(--sky),var(--cyan))}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px;overflow:hidden}
.card h2{background:var(--blue);color:#fff;font-size:12.5px;padding:9px 14px;letter-spacing:.4px;
         display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:normal;opacity:.9;font-size:11.5px}
.body{padding:12px 14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#eef3f7;color:var(--navy);text-align:left;padding:6px 8px;font-size:11px;
   border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid #f2f5f8}
td.c,th.c{text-align:center}
tr.nea td{border-top:2px solid var(--line)}
td.imer{white-space:nowrap;color:#556}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{flex:1;min-width:150px;background:#f7fafc;border-left:4px solid var(--cyan);border-radius:6px;padding:10px 12px}
.tile .l{font-size:11px;color:#778;text-transform:uppercase}
.tile .v{font-size:19px;font-weight:bold;color:var(--navy);margin-top:3px}
.ok{color:var(--green);font-weight:bold}
.bad{color:var(--red);font-weight:bold}
.none{color:#ccd5dc}
.foot{font-size:11px;color:#778;padding:10px 14px}
.empty{padding:16px;color:#889}
a.link{color:var(--blue);font-weight:bold}
</style></head><body>
<div class="head"><img src="hotelier.jpg" alt="InCo Hotelier Services">
  <div><h1 id="titlos">ΣΥΓΚΕΝΤΡΩΤΙΚΑ WATER SAFETY</h1>
  <div class="sub">Πίνακας διαρκούς ενημέρωσης καταγραφών · InCo — Εφαρμογές Δημόσιας Υγείας</div></div></div>
<div class="stripe"></div>
<div class="wrap" id="wrap"><div class="card"><div class="empty" id="katastasi">Φόρτωση δεδομένων…</div></div></div>

<script>
// ---------------------------------------------------------------------------
// ΣΥΓΚΕΝΤΡΩΤΙΚΑ ανά ΕΙΔΟΣ ΕΛΕΓΧΟΥ — ρητό χρήστη 23/09/2026: «συγκεντρωτικά για
// λεγιονέλα, συγκεντρωτικά για πόσιμο, συγκεντρωτικό για κολυμβητική, συγκεντρωτικό
// για swab test» (όχι όλα ανακατεμένα). Ένας πίνακας για κάθε είδος, σαν τα Excel
// «ΣΥΓΚΕΝΤΡΩΤΙΚΑ» — πιο πρόσφατη δειγματοληψία πρώτη.
// Το ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ είναι ΞΕΧΩΡΙΣΤΗ σελίδα (plano.html).
// ⚠️ Τ/Cl/pH μετριούνται μόνο σε λεγεωνέλλα και κολυμβητικές· σε πόσιμο και
// επιφάνειες ΔΕΝ γίνονται μετρήσεις πεδίου, άρα οι στήλες δεν εμφανίζονται.
// ⚠️ Οι παράμετροι φαίνονται ΟΠΩΣ ΤΙΣ ΓΡΑΦΕΙ ΤΟ ΕΡΓΑΣΤΗΡΙΟ — καμία μετάφραση.
// ---------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const SCRIPT = P.get('script'), KOD = P.get('kod'), PELATIS = P.get('pelatis') || '';
const PLANO = 'plano.html' + location.search;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const el = document.getElementById('wrap');
const imer = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
const num = v => (v === '' || v === null || v === undefined) ? '<span class="none">—</span>' :
                 String(v).replace('.', ',');
const katharo = v => String(v == null ? '' : v).replace(/\s*\((?:i|ii|iii|iv|\*)\)/g, '');
if (PELATIS) document.getElementById('titlos').textContent = 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ WATER SAFETY — ' + PELATIS;

const EIDI = [
  { key: 'LEGIONELLA',  titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΛΕΓΕΩΝΕΛΛΑΣ',            metriseis: true },
  { key: 'ΠΟΣΙΜΟ',      titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΠΟΣΙΜΟΥ ΝΕΡΟΥ',           metriseis: false },
  { key: 'ΚΟΛΥΜΒΗΤΙΚΗ', titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΚΟΛΥΜΒΗΤΙΚΗΣ / JACUZZI',  metriseis: true },
  { key: 'ΕΠΙΦΑΝΕΙΕΣ',  titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΕΠΙΦΑΝΕΙΩΝ (SWAB TEST)',  metriseis: false }
];

function pinakas(rows, metriseis){
  let h = '<div class="scroll"><table><tr><th>Ημερομηνία</th><th>Σημείο</th>' +
          (metriseis ? '<th class="c">Νερό</th><th class="c">Τ °C</th><th class="c">Cl</th><th class="c">pH</th>' : '') +
          '<th>Παράμετρος</th><th class="c">Αποτέλεσμα</th><th class="c">Όριο</th><th class="c">Κρίση</th></tr>';
  let prin = '';
  rows.forEach(x => {
    const nea = x['ΗΜΕΡΟΜΗΝΙΑ'] !== prin;
    prin = x['ΗΜΕΡΟΜΗΝΙΑ'];
    const simeio = [x['ΧΩΡΟΣ'], x['ΣΗΜΕΙΟ']].filter(Boolean).join(' · ');
    h += '<tr' + (nea ? ' class="nea"' : '') + '><td class="imer">' + (nea ? imer(x['ΗΜΕΡΟΜΗΝΙΑ']) : '') +
         '</td><td>' + esc(simeio) + '</td>' +
         (metriseis ? '<td class="c">' + esc(x['ΝΕΡΟ'] || '') + '</td><td class="c">' +
            num(x['ΘΕΡΜΟΚΡΑΣΙΑ']) + '</td><td class="c">' + num(x['ΧΛΩΡΙΟ']) + '</td><td class="c">' +
            num(x['PH']) + '</td>' : '') +
         '<td>' + (x['ΠΑΡΑΜΕΤΡΟΣ'] ? esc(x['ΠΑΡΑΜΕΤΡΟΣ']) : '<span class="none">δεν έχει καταχωρηθεί</span>') +
         '</td><td class="c">' + (x['ΑΠΟΤΕΛΕΣΜΑ'] ? esc(katharo(x['ΑΠΟΤΕΛΕΣΜΑ'])) + ' ' + esc(x['ΜΟΝΑΔΑ'] || '')
            : '<span class="none">—</span>') +
         '</td><td class="c">' + (x['ΟΡΙΟ'] ? esc(x['ΟΡΙΟ']) : '<span class="none">—</span>') +
         '</td><td class="c">' + (x['ΠΑΡΑΜΕΤΡΟΣ']
            ? (+x['ΥΠΕΡΒΑΣΗ'] === 1 ? '<span class="bad">ΕΚΤΟΣ</span>' : '<span class="ok">εντός</span>')
            : '<span class="none">—</span>') + '</td></tr>';
  });
  return h + '</table></div>';
}

function render(d){
  const ep = d.episkepseis || [], met = d.metriseis || [];
  if (!ep.length) {
    el.innerHTML = '<div class="card"><h2>ΚΑΤΑΓΡΑΦΕΣ</h2><div class="empty">Δεν υπάρχουν ακόμη ' +
      'καταχωρημένες δειγματοληψίες.</div></div>';
    return;
  }
  const teleftaia = ep.map(x => x['ΗΜΕΡΟΜΗΝΙΑ']).sort().pop();
  const yper = met.filter(x => +x['ΥΠΕΡΒΑΣΗ'] === 1).length;
  const epomenes = ep.map(x => x['ΕΠΟΜΕΝΗ']).filter(Boolean).sort();

  let html = '<div class="card"><div class="body"><div class="tiles">' +
    '<div class="tile"><div class="l">Τελευταία δειγματοληψία</div><div class="v">' + imer(teleftaia) + '</div></div>' +
    '<div class="tile"><div class="l">Δειγματοληψίες συνολικά</div><div class="v">' + ep.length + '</div></div>' +
    '<div class="tile"><div class="l">Δείγματα συνολικά</div><div class="v">' +
      ep.reduce((s,x) => s + (+x['ΔΕΙΓΜΑΤΑ'] || 0), 0) + '</div></div>' +
    '<div class="tile"><div class="l">Ευρήματα εκτός ορίων</div><div class="v ' + (yper ? 'bad' : 'ok') +
      '">' + yper + '</div></div>' +
    (epomenes.length ? '<div class="tile"><div class="l">Επόμενη προγραμματισμένη</div><div class="v">' +
      imer(epomenes[epomenes.length-1]) + '</div></div>' : '') +
    '</div><div class="foot" style="padding:10px 0 0"><a class="link" href="' + PLANO +
    '">→ Πλάνο δειγματοληψίας λεγεωνέλλας (πού έχει γίνει και πού όχι)</a></div></div></div>';

  EIDI.forEach(e => {
    const rows = met.filter(x => x['ΕΙΔΟΣ'] === e.key)
                    .sort((a,b) => (a['ΗΜΕΡΟΜΗΝΙΑ'] < b['ΗΜΕΡΟΜΗΝΙΑ'] ? 1 :
                                    a['ΗΜΕΡΟΜΗΝΙΑ'] > b['ΗΜΕΡΟΜΗΝΙΑ'] ? -1 :
                                    (a['ΣΗΜΕΙΟ_ID'] || 0) - (b['ΣΗΜΕΙΟ_ID'] || 0)));
    if (!rows.length) return;
    const episk = ep.filter(x => x['ΕΙΔΟΣ'] === e.key).length;
    html += '<div class="card"><h2>' + e.titlos + '<small>' + episk + ' δειγματοληψίες · ' +
            rows.length + ' γραμμές</small></h2><div class="body">' +
            pinakas(rows, e.metriseis) + '</div></div>';
  });

  html += '<div class="foot" style="text-align:center">Ενημερώθηκε ' +
          new Date().toLocaleString('el-GR') +
          ' · InCo — Εφαρμογές Δημόσιας Υγείας · Δελφών 140, Γλυφάδα · 210 9644310</div>';
  el.innerHTML = html;
}

if (!SCRIPT || !KOD) {
  document.getElementById('katastasi').textContent =
    'Ο σύνδεσμος δεν είναι πλήρης — λείπει ο πελάτης. Ζήτησέ μας καινούργιο σύνδεσμο.';
} else {
  // ⚠️ Το Google απαντά κάπου-κάπου 404 στην πρώτη κλήση — τρεις προσπάθειες.
  (function fortose(p){
    fetch(SCRIPT + '?action=katagrafes&kod=' + encodeURIComponent(KOD) + '&t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => { if (d && d.ok) render(d); else throw new Error((d && d.error) || 'άγνωστο'); })
      .catch(e => {
        if (p < 3) { document.getElementById('katastasi').textContent =
            'Φόρτωση δεδομένων… (προσπάθεια ' + (p + 1) + ')';
          setTimeout(function(){ fortose(p + 1); }, 2500); return; }
        document.getElementById('katastasi').textContent =
          'Δεν φορτώθηκαν τα δεδομένα (' + e.message + '). Δοκίμασε ξανά σε λίγο.';
      });
  })(1);
}
</script>
</body></html>
