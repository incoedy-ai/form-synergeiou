<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Συγκεντρωτικά Water Safety</title>
<style>
:root{--navy:#2D3A4D;--blue:#287B9B;--cyan:#2DAFCE;--sky:#6FB7D6;--bg:#f0f2f5;--line:#dde5ec;--red:#C62828;--green:#1b7f3b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Verdana,Arial,sans-serif;font-size:14px;background:var(--bg);color:#222}
.head{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
.head img{height:56px;width:auto;background:#fff;border-radius:6px;padding:3px;flex:none}
.head h1{font-size:17px;letter-spacing:.4px}
.head .sub{font-size:12px;opacity:.85;margin-top:5px}
.stripe{height:4px;background:linear-gradient(90deg,var(--sky),var(--cyan))}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px;overflow:hidden}
.card h2{background:var(--blue);color:#fff;font-size:12.5px;padding:9px 14px;letter-spacing:.4px;
         display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:normal;opacity:.9;font-size:11.5px}
.body{padding:12px 14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:#eef3f7;color:var(--navy);text-align:left;padding:6px 8px;font-size:11px;
   border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f2f5f8}
td.c,th.c{text-align:center}
th.par{white-space:normal;max-width:120px;line-height:1.3;vertical-align:bottom}
th.par .orio{display:block;font-weight:normal;color:#778;font-size:10px;margin-top:2px}
td.imer{white-space:nowrap;color:#556}
/* ΜΙΑ ΓΡΑΜΜΗ ΑΝΑ ΔΕΙΓΜΑ + πτυσσόμενη ενότητα ανά δειγματοληψία (23/09/2026) */
details.ep{border-top:1px solid var(--line)}
details.ep:first-child{border-top:none}
summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:10px;
        font-size:12.5px;background:#fbfdfe}
summary::-webkit-details-marker{display:none}
summary:hover{background:#f2f7fa}
summary .arrow{color:var(--blue);font-size:10px;width:10px;flex:none}
details[open]>summary{background:#eef3f7;border-bottom:1px solid var(--line)}
details[open]>summary .arrow{transform:rotate(90deg)}
summary .d{font-weight:bold;color:var(--navy);min-width:88px}
summary .n{color:#667}
summary .sp{margin-left:auto;font-size:11.5px}
.tgl{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.5);
     border-radius:4px;font:inherit;font-size:11px;padding:2px 8px;cursor:pointer}
.tgl:hover{background:rgba(255,255,255,.3)}
.tgl[disabled]{background:#fff;color:var(--blue);border-color:#fff;cursor:default;font-weight:bold}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{flex:1;min-width:150px;background:#f7fafc;border-left:4px solid var(--cyan);border-radius:6px;padding:10px 12px}
.tile .l{font-size:11px;color:#778;text-transform:uppercase}
.tile .v{font-size:19px;font-weight:bold;color:var(--navy);margin-top:3px}
/* ΚΑΡΤΕΛΕΣ ανά είδος ελέγχου — ρητό χρήστη 23/09/2026 («να αλλάζεις καρτέλες») */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{background:#fff;border:1px solid var(--line);border-bottom:3px solid var(--line);
     border-radius:6px 6px 0 0;color:var(--navy);font:inherit;font-size:12px;font-weight:bold;
     padding:9px 14px;cursor:pointer}
.tab:hover{border-bottom-color:var(--sky)}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue);border-bottom-color:var(--cyan)}
.tab .n{font-weight:normal;opacity:.75;margin-left:6px;font-size:11px}
.ok{color:var(--green);font-weight:bold}
.bad{color:var(--red);font-weight:bold}
.none{color:#ccd5dc}
.foot{font-size:11px;color:#778;padding:10px 14px}

a.link{color:var(--blue);font-weight:bold}
</style></head><body>
<div class="head"><img src="hotelier.jpg" alt="InCo Hotelier Services">
  <div><h1 id="titlos">ΣΥΓΚΕΝΤΡΩΤΙΚΑ WATER SAFETY</h1>
  <div class="sub">Πίνακας διαρκούς ενημέρωσης καταγραφών · InCo — Εφαρμογές Δημόσιας Υγείας</div></div></div>
<div class="stripe"></div>
<div class="wrap" id="wrap"><div class="card"><div class="empty" id="katastasi">Φόρτωση δεδομένων…</div></div></div>

<script>
// ---------------------------------------------------------------------------
// ΣΥΓΚΕΝΤΡΩΤΙΚΑ ανά ΕΙΔΟΣ ΕΛΕΓΧΟΥ — ρητό χρήστη 23/09/2026: «συγκεντρωτικά για
// λεγιονέλα, συγκεντρωτικά για πόσιμο, συγκεντρωτικό για κολυμβητική, συγκεντρωτικό
// για swab test» (όχι όλα ανακατεμένα). Ένας πίνακας για κάθε είδος, σαν τα Excel
// «ΣΥΓΚΕΝΤΡΩΤΙΚΑ» — πιο πρόσφατη δειγματοληψία πρώτη.
// Το ΠΛΑΝΟ ΔΕΙΓΜΑΤΟΛΗΨΙΑΣ είναι ΞΕΧΩΡΙΣΤΗ σελίδα (plano.html).
// ⚠️ Τ/Cl/pH μετριούνται μόνο σε λεγεωνέλλα και κολυμβητικές· σε πόσιμο και
// επιφάνειες ΔΕΝ γίνονται μετρήσεις πεδίου, άρα οι στήλες δεν εμφανίζονται.
// ⚠️ Οι παράμετροι φαίνονται ΟΠΩΣ ΤΙΣ ΓΡΑΦΕΙ ΤΟ ΕΡΓΑΣΤΗΡΙΟ — καμία μετάφραση.
// ---------------------------------------------------------------------------
const P = new URLSearchParams(location.search);
const SCRIPT = P.get('script'), KOD = P.get('kod'), PELATIS = P.get('pelatis') || '';
const PLANO = 'plano.html' + location.search;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const el = document.getElementById('wrap');
const imer = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '';
const num = v => (v === '' || v === null || v === undefined) ? '<span class="none">—</span>' :
                 String(v).replace('.', ',');
const ekth = s => esc(s).replace(/\^(-?\d+)/g, '<sup>$1</sup>');
const katharo = v => String(v == null ? '' : v).replace(/\s*\((?:i|ii|iii|iv|\*)\)/g, '');
if (PELATIS) document.getElementById('titlos').textContent = 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ WATER SAFETY — ' + PELATIS;

const EIDI = [
  { key: 'LEGIONELLA',  koumpi: 'ΛΕΓΕΩΝΕΛΛΑ',   titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΛΕΓΕΩΝΕΛΛΑΣ',            metriseis: true },
  { key: 'ΠΟΣΙΜΟ',      koumpi: 'ΠΟΣΙΜΟ ΝΕΡΟ',  titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΠΟΣΙΜΟΥ ΝΕΡΟΥ',           metriseis: false },
  { key: 'ΚΟΛΥΜΒΗΤΙΚΗ', koumpi: 'ΚΟΛΥΜΒΗΤΙΚΕΣ', titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΚΟΛΥΜΒΗΤΙΚΗΣ / JACUZZI',  metriseis: true },
  { key: 'ΕΠΙΦΑΝΕΙΕΣ',  koumpi: 'SWAB TEST',    titlos: 'ΣΥΓΚΕΝΤΡΩΤΙΚΑ ΕΠΙΦΑΝΕΙΩΝ (SWAB TEST)',  metriseis: false }
];

/* Η ΙΔΙΑ ανάλυση γράφεται αλλιώς ανά χρονιά και ανά εργαστήριο («Αερόβιοι 37 °C» /
   «Micro-organisms enumeration @ 36±2°C», «E. coli» / «Escherichia coli»). Στον
   συγκεντρωτικό πίνακα πρέπει να πέφτουν στην ΙΔΙΑ ΣΤΗΛΗ, αλλιώς βγαίνουν διπλές
   μισοάδειες στήλες. Η ΕΠΙΚΕΦΑΛΙΔΑ μένει όπως τη γράφει το ΠΙΟ ΠΡΟΣΦΑΤΟ πιστοποιητικό
   — καμία δική μας μετάφραση (ρητό χρήστη: «όπως είναι στο πιστοποιητικό»). */
function kleidiPar(p){
  const s = String(p).toLowerCase().replace(/\s+/g, ' ').trim();
  if (/legionella/.test(s)) return 'legionella';
  if (/clostridium|περφριγκ/.test(s)) return 'clostridium';
  if (/enterococc|εντερόκοκκ/.test(s)) return 'enterococci';
  if (/escherichia|e\.\s?coli/.test(s)) return 'ecoli';
  if (/coliform|κολοβακτηρ/.test(s)) return 'coliforms';
  if (/micro-?organism|αερόβι|αποικ/.test(s)) {
    const t = (s.match(/\b(22|30|36|37)\b/) || [])[1];
    return 'aerob' + (t === '36' ? '37' : (t || ''));    // 36±2°C = 37 °C, ίδια ανάλυση
  }
  return s;
}

// Το κλειδί του ΔΕΙΓΜΑΤΟΣ. Κρατάμε και εφεδρικό κλειδί, για την περίπτωση που το
// φύλλο δεν έχει ακόμη τη στήλη ΔΕΙΓΜΑ_ID (παλιό push) — αλλιώς η σελίδα αδειάζει.
const klidi = x => x['ΔΕΙΓΜΑ_ID'] ||
  [x['ΕΠΙΣΚΕΨΗ_ID'], x['ΣΗΜΕΙΟ_ID'], x['ΧΩΡΟΣ'], x['ΣΗΜΕΙΟ'], x['ΝΕΡΟ']].join('|');

/* ΣΕΙΡΑ ΣΗΜΕΙΩΝ: ΔΩΜΑΤΙΟ 1, ΔΩΜΑΤΙΟ 2, ΔΩΜΑΤΙΟ 10 — όχι 1, 10, 2 (ρητό 23/09/2026).
   Το {numeric:true} συγκρίνει τα νούμερα ως νούμερα, όποια κι αν είναι η γραφή του
   ξενοδοχείου (1 ή 001). Μέσα στο ίδιο σημείο: κρύο αρχή/επιστροφή, ζεστό αρχή/επιστροφή. */
const NERA = ['Κ.Α', 'Κ.Ε', 'Ζ.Α', 'Ζ.Ε'];
const taxiSimeiou = (a, b) =>
  String(a['ΧΩΡΟΣ'] || '').localeCompare(String(b['ΧΩΡΟΣ'] || ''), 'el', { numeric: true }) ||
  String(a['ΣΗΜΕΙΟ'] || '').localeCompare(String(b['ΣΗΜΕΙΟ'] || ''), 'el', { numeric: true }) ||
  NERA.indexOf(a['ΝΕΡΟ']) - NERA.indexOf(b['ΝΕΡΟ']);

/* Μία γραμμή ανά ΔΕΙΓΜΑ — οι παράμετροι γίνονται ΣΤΗΛΕΣ.
   Πριν, κάθε ανάλυση έπιανε δική της γραμμή: ένα δείγμα πόσιμου = 6 γραμμές. */
function deigmata(rows){
  const m = new Map();
  rows.forEach(x => {
    const k = klidi(x);
    if (!m.has(k)) m.set(k, { x: x, res: {} });
    if (x['ΠΑΡΑΜΕΤΡΟΣ']) m.get(k).res[kleidiPar(x['ΠΑΡΑΜΕΤΡΟΣ'])] = x;
  });
  return [...m.values()];
}

function pinakas(deig, st, metriseis){
  const pars = st.pars;
  let h = '<div class="scroll"><table><tr><th>Σημείο</th>' +
          (metriseis ? '<th class="c">Νερό</th><th class="c">Τ °C</th><th class="c">Cl</th><th class="c">pH</th>' : '');
  pars.forEach(p => {
    // Η ΜΟΝΑΔΑ και το ΟΡΙΟ μπαίνουν στην επικεφαλίδα — ίδια για όλη τη στήλη, δεν
    // υπάρχει λόγος να επαναλαμβάνονται σε κάθε κελί.
    const ypo = [st.monMix[p] ? '' : st.mon[p], st.oria[p] ? 'όριο ' + st.oria[p] : '']
                .filter(Boolean).join(' · ');
    h += '<th class="par c">' + esc(st.onoma[p]) +
         (ypo ? '<span class="orio">' + esc(ypo) + '</span>' : '') + '</th>';
  });
  h += '</tr>';
  deig.forEach(s => {
    const x = s.x, simeio = [x['ΧΩΡΟΣ'], x['ΣΗΜΕΙΟ']].filter(Boolean).join(' · ');
    h += '<tr><td>' + esc(simeio) + '</td>' +
         (metriseis ? '<td class="c">' + esc(x['ΝΕΡΟ'] || '') + '</td><td class="c">' +
            num(x['ΘΕΡΜΟΚΡΑΣΙΑ']) + '</td><td class="c">' + num(x['ΧΛΩΡΙΟ']) + '</td><td class="c">' +
            num(x['PH']) + '</td>' : '');
    pars.forEach(p => {
      const r = s.res[p];
      if (!r || !r['ΑΠΟΤΕΛΕΣΜΑ']) { h += '<td class="c"><span class="none">—</span></td>'; return; }
      const t = ekth(katharo(r['ΑΠΟΤΕΛΕΣΜΑ'])) +
                (st.monMix[p] && r['ΜΟΝΑΔΑ'] ? ' ' + esc(r['ΜΟΝΑΔΑ']) : '');
      h += '<td class="c">' + (+r['ΥΠΕΡΒΑΣΗ'] === 1 ? '<span class="bad">' + t + '</span>' : t) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</table></div>';
}

/* Οι ΣΤΗΛΕΣ ΑΝΑΛΥΣΕΩΝ, ίδιες σε όλες τις ενότητες ώστε να συγκρίνονται με το μάτι.
   ⚠️ Οι γραμμές έρχονται με την πιο πρόσφατη πρώτη, άρα η πρώτη διατύπωση που
   συναντάμε είναι του νεότερου πιστοποιητικού — αυτή μπαίνει επικεφαλίδα. */
function stiles(rows){
  const st = { pars: [], onoma: {}, oria: {}, mon: {}, monMix: {} };
  rows.forEach(x => {
    if (!x['ΠΑΡΑΜΕΤΡΟΣ']) return;
    const k = kleidiPar(x['ΠΑΡΑΜΕΤΡΟΣ']), u = String(x['ΜΟΝΑΔΑ'] || '').trim();
    // ⚠️ Το εργαστήριο χώνει και την αβεβαιότητα μέτρησης μέσα στο όριο
    // («U:[7x10^1 - 9,2x10^1] max 200») — στην επικεφαλίδα θέλουμε μόνο το όριο.
    let or = katharo(x['ΟΡΙΟ'] || '').replace(/U\s*:\s*\[[^\]]*\]/g, '').trim();
    if (or === '-' || or === '') or = '';
    if (st.pars.indexOf(k) < 0) {
      st.pars.push(k); st.onoma[k] = x['ΠΑΡΑΜΕΤΡΟΣ']; st.oria[k] = or; st.mon[k] = u;
    } else {
      if (!st.oria[k]) st.oria[k] = or;          // κρατάει το πιο πρόσφατο μη κενό όριο
      if (st.mon[k] !== u) st.monMix[k] = true;  // διαφορετικές μονάδες -> μένουν στα κελιά
    }
  });
  return st;
}

/* ΟΨΗ 1 — ΑΝΑ ΔΕΙΓΜΑΤΟΛΗΨΙΑ: μία πτυσσόμενη ενότητα ανά ημερομηνία, ανοιχτή η τελευταία.
   Απαντά στο «τι έδειξε η τελευταία δειγματοληψία». */
function enotites(rows, st, metriseis){
  const anaEp = new Map();
  rows.forEach(x => {
    const k = x['ΕΠΙΣΚΕΨΗ_ID'];
    if (!anaEp.has(k)) anaEp.set(k, { imerominia: x['ΗΜΕΡΟΜΗΝΙΑ'], rows: [] });
    anaEp.get(k).rows.push(x);
  });
  const seira = [...anaEp.values()].sort((a, b) => a.imerominia < b.imerominia ? 1 : -1);
  let h = '';
  seira.forEach((e, i) => {
    const d = deigmata(e.rows).sort((p, q) => taxiSimeiou(p.x, q.x));
    const yp = e.rows.filter(x => +x['ΥΠΕΡΒΑΣΗ'] === 1).length;
    const xoris = d.filter(s => !Object.keys(s.res).length).length;
    h += '<details class="ep"' + (i === 0 ? ' open' : '') + '><summary><span class="arrow">▶</span>' +
         '<span class="d">' + imer(e.imerominia) + '</span>' +
         '<span class="n">' + d.length + (d.length === 1 ? ' δείγμα' : ' δείγματα') + '</span>' +
         '<span class="sp">' + (yp ? '<span class="bad">' + yp + ' εκτός ορίων</span>'
            : xoris === d.length ? '<span class="none" style="color:#889">αναμονή αποτελεσμάτων</span>'
            : '<span class="ok">όλα εντός ορίων</span>' +
              (xoris ? ' <span class="n">· ' + xoris + ' σε αναμονή</span>' : '')) +
         '</span></summary>' + pinakas(d, st, metriseis) + '</details>';
  });
  return h;
}

/* ΟΨΗ 2 — ΑΝΑ ΣΗΜΕΙΟ: κάθε σημείο μία γραμμή, στήλες οι ημερομηνίες.
   Απαντά στο «τι έδειξε ΑΥΤΟ το σημείο όλα αυτά τα χρόνια».
   Όπου η ανάλυση είναι μία (λεγεωνέλλα) το κελί δείχνει την ΤΙΜΗ· όπου είναι
   πολλές (πόσιμο, swab) δείχνει ✓ / ✗ και οι τιμές φαίνονται στο δείκτη. */
function anaSimeio(rows, st, metriseis, SIM){
  const imerominies = [...new Set(rows.map(x => x['ΗΜΕΡΟΜΗΝΙΑ']))].sort().reverse();
  const gram = new Map();
  // ⚠️ Ομαδοποίηση με το ΣΗΜΕΙΟ ΤΟΥ ΠΛΑΝΟΥ (ΣΗΜΕΙΟ_ID), όχι με το κείμενο: ο τεχνικός
  // έγραφε το ίδιο σημείο αλλιώς κάθε χρονιά («ΝΤΟΥΣ» / «ΝΤΟΥΣ / ΤΗΛΕΦΩΝΟ») και το
  // δωμάτιο έβγαινε σε δύο γραμμές. Οι διαφορετικές γραφές φαίνονται στον δείκτη.
  // Προσοχή: σημεία με ΔΙΚΟ τους ΣΗΜΕΙΟ_ID (Π1 και Π01) μένουν ΧΩΡΙΣΤΑ — δεν είναι
  // πάντα το ίδιο σημείο [[ws: S1 δεν είναι πάντα S01]].
  deigmata(rows).forEach(s => {
    const x = s.x;
    const k = (x['ΣΗΜΕΙΟ_ID'] ? 'id:' + x['ΣΗΜΕΙΟ_ID'] : [x['ΧΩΡΟΣ'], x['ΣΗΜΕΙΟ']].join('|')) +
              '|' + (x['ΝΕΡΟ'] || '');
    if (!gram.has(k)) gram.set(k, { x: x, grafes: new Set(), kata: {} });
    const g = gram.get(k);
    g.kata[x['ΗΜΕΡΟΜΗΝΙΑ']] = s;               // ένα δείγμα ανά σημείο & ημερομηνία
    if (x['ΣΗΜΕΙΟ']) g.grafes.add(String(x['ΣΗΜΕΙΟ']).trim());
    const p = SIM && SIM[x['ΣΗΜΕΙΟ_ID']];      // το όνομα του πλάνου υπερισχύει
    if (p) g.x = Object.assign({}, x, { ΧΩΡΟΣ: p['ΧΩΡΟΣ'], ΣΗΜΕΙΟ: p['ΣΗΜΕΙΟ'] });
  });
  const seira = [...gram.values()].sort((a, b) => taxiSimeiou(a.x, b.x));

  let h = '<div class="scroll"><table><tr><th>Σημείο</th>' + (metriseis ? '<th class="c">Νερό</th>' : '');
  imerominies.forEach(d => h += '<th class="c">' + imer(d) + '</th>');
  h += '</tr>';
  seira.forEach(g => {
    const x = g.x;
    const alles = [...g.grafes].filter(v => v && v !== String(x['ΣΗΜΕΙΟ'] || '').trim());
    h += '<tr><td' + (alles.length ? ' title="γράφτηκε και ως: ' + esc(alles.join(' · ')) + '"' : '') +
         '>' + esc([x['ΧΩΡΟΣ'], x['ΣΗΜΕΙΟ']].filter(Boolean).join(' · ')) +
         (alles.length ? ' <span class="none" style="color:#aab">*</span>' : '') + '</td>' +
         (metriseis ? '<td class="c">' + esc(x['ΝΕΡΟ'] || '') + '</td>' : '');
    imerominies.forEach(d => {
      const s = g.kata[d];
      if (!s) { h += '<td class="c"><span class="none">·</span></td>'; return; }
      const res = st.pars.map(p => s.res[p]).filter(r => r && r['ΑΠΟΤΕΛΕΣΜΑ']);
      if (!res.length) { h += '<td class="c" title="αναμονή αποτελεσμάτων">' +
        '<span class="none" style="color:#aab">◌</span></td>'; return; }
      const ekt = res.some(r => +r['ΥΠΕΡΒΑΣΗ'] === 1);
      const titl = res.map(r => st.onoma[kleidiPar(r['ΠΑΡΑΜΕΤΡΟΣ'])] + ': ' +
                   katharo(r['ΑΠΟΤΕΛΕΣΜΑ']) + ' ' + (r['ΜΟΝΑΔΑ'] || '')).join('\n');
      const mesa = st.pars.length === 1 ? ekth(katharo(res[0]['ΑΠΟΤΕΛΕΣΜΑ']))
                                        : (ekt ? '✗' : '✓');
      h += '<td class="c" title="' + esc(titl) + '">' +
           '<span class="' + (ekt ? 'bad' : 'ok') + '">' + mesa + '</span></td>';
    });
    h += '</tr>';
  });
  return h + '</table></div><div class="foot">· δεν έγινε δειγματοληψία · ◌ αναμονή αποτελεσμάτων' + ' · <span class="none" style="color:#aab">*</span> το σημείο έχει γραφτεί και αλλιώς ' + '(φαίνεται αν αφήσεις τον δείκτη πάνω στο όνομα)' +
         (st.pars.length === 1 ? '' : ' · ✓ εντός ορίων · ✗ εκτός ορίων — οι τιμές φαίνονται ' +
          'αν αφήσεις τον δείκτη πάνω στο σημάδι') + '</div>';
}

function render(d){
  const ep = d.episkepseis || [], met = d.metriseis || [];
  // Τα σημεία του ΠΛΑΝΟΥ: δίνουν το επίσημο όνομα σε κάθε σημείο δειγματοληψίας.
  const SIM = {};
  (d.simeia || []).forEach(x => { SIM[x['ΣΗΜΕΙΟ_ID']] = x; });
  if (!ep.length) {
    el.innerHTML = '<div class="card"><h2>ΚΑΤΑΓΡΑΦΕΣ</h2><div class="empty">Δεν υπάρχουν ακόμη ' +
      'καταχωρημένες δειγματοληψίες.</div></div>';
    return;
  }
  const teleftaia = ep.map(x => x['ΗΜΕΡΟΜΗΝΙΑ']).sort().pop();
  const yper = met.filter(x => +x['ΥΠΕΡΒΑΣΗ'] === 1).length;
  const epomenes = ep.map(x => x['ΕΠΟΜΕΝΗ']).filter(Boolean).sort();

  let html = '<div class="card"><div class="body"><div class="tiles">' +
    '<div class="tile"><div class="l">Τελευταία δειγματοληψία</div><div class="v">' + imer(teleftaia) + '</div></div>' +
    '<div class="tile"><div class="l">Δειγματοληψίες συνολικά</div><div class="v">' + ep.length + '</div></div>' +
    '<div class="tile"><div class="l">Δείγματα συνολικά</div><div class="v">' +
      ep.reduce((s,x) => s + (+x['ΔΕΙΓΜΑΤΑ'] || 0), 0) + '</div></div>' +
    '<div class="tile"><div class="l">Ευρήματα εκτός ορίων</div><div class="v ' + (yper ? 'bad' : 'ok') +
      '">' + yper + '</div></div>' +
    (epomenes.length ? '<div class="tile"><div class="l">Επόμενη προγραμματισμένη</div><div class="v">' +
      imer(epomenes[epomenes.length-1]) + '</div></div>' : '') +
    '</div><div class="foot" style="padding:10px 0 0"><a class="link" href="' + PLANO +
    '">→ Πλάνο δειγματοληψίας λεγεωνέλλας (πού έχει γίνει και πού όχι)</a></div></div></div>';

  // ΚΑΡΤΕΛΕΣ: μόνο τα είδη που έχουν δειγματοληψίες, πρώτη ανοιχτή η λεγεωνέλλα.
  const diathesima = EIDI.map(e => {
    const rows = met.filter(x => x['ΕΙΔΟΣ'] === e.key)
                    .sort((a,b) => (a['ΗΜΕΡΟΜΗΝΙΑ'] < b['ΗΜΕΡΟΜΗΝΙΑ'] ? 1 :
                                    a['ΗΜΕΡΟΜΗΝΙΑ'] > b['ΗΜΕΡΟΜΗΝΙΑ'] ? -1 :
                                    (a['ΣΗΜΕΙΟ_ID'] || 0) - (b['ΣΗΜΕΙΟ_ID'] || 0)));
    return Object.assign({}, e, { rows: rows, episk: ep.filter(x => x['ΕΙΔΟΣ'] === e.key).length });
  }).filter(e => e.rows.length);

  html += '<div class="tabs">' + diathesima.map((e, i) =>
    '<button class="tab' + (i === 0 ? ' on' : '') + '" data-k="' + e.key + '">' + e.koumpi +
    '<span class="n">' + e.episk + '</span></button>').join('') + '</div>';

  // ΔΥΟ ΟΨΕΙΣ σε κάθε είδος — κρατάμε και τις δύο, όπως και στο πλάνο:
  // «ανά δειγματοληψία» (τι έδειξε η τελευταία) και «ανά σημείο» (η πορεία του σημείου).
  const OPSI = localStorage.getItem('ws_kat_opsi') === 'simeio' ? 'simeio' : 'imer';
  diathesima.forEach((e, i) => {
    const st = stiles(e.rows);
    html += '<div class="card eidos" data-k="' + e.key + '"' + (i ? ' hidden' : '') + '><h2>' + e.titlos +
            '<small><button class="tgl opsi" data-o="imer"' + (OPSI === 'imer' ? ' disabled' : '') +
            '>ανά δειγματοληψία</button> <button class="tgl opsi" data-o="simeio"' +
            (OPSI === 'simeio' ? ' disabled' : '') + '>ανά σημείο</button>' +
            ' &nbsp;<button class="tgl ola"' + (OPSI === 'simeio' ? ' hidden' : '') +
            '>άνοιγμα όλων</button></small></h2>' +
            '<div class="opsi-imer"' + (OPSI === 'imer' ? '' : ' hidden') + '>' +
              enotites(e.rows, st, e.metriseis) + '</div>' +
            '<div class="opsi-simeio"' + (OPSI === 'simeio' ? '' : ' hidden') + '>' +
              anaSimeio(e.rows, st, e.metriseis, SIM) + '</div></div>';
  });

  html += '<div class="foot" style="text-align:center">Ενημερώθηκε ' +
          new Date().toLocaleString('el-GR') +
          ' · InCo — Εφαρμογές Δημόσιας Υγείας · Δελφών 140, Γλυφάδα · 210 9644310</div>';
  el.innerHTML = html;

  el.querySelectorAll('.tab').forEach(b => b.onclick = () => {
    el.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    el.querySelectorAll('.eidos').forEach(c => c.hidden = c.dataset.k !== b.dataset.k);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  el.querySelectorAll('.tgl.ola').forEach(b => b.onclick = () => {
    const card = b.closest('.eidos'), anoixta = !card.querySelector('details:not([open])');
    card.querySelectorAll('details').forEach(d => d.open = !anoixta);
    b.textContent = anoixta ? 'άνοιγμα όλων' : 'κλείσιμο όλων';
  });
  // Η επιλογή όψης ισχύει για ΟΛΕΣ τις καρτέλες και κρατιέται για την επόμενη φορά.
  el.querySelectorAll('.tgl.opsi').forEach(b => b.onclick = () => {
    const o = b.dataset.o;
    try { localStorage.setItem('ws_kat_opsi', o); } catch (e) {}
    el.querySelectorAll('.eidos').forEach(card => {
      card.querySelector('.opsi-imer').hidden = o !== 'imer';
      card.querySelector('.opsi-simeio').hidden = o !== 'simeio';
      card.querySelector('.tgl.ola').hidden = o !== 'imer';
      card.querySelectorAll('.tgl.opsi').forEach(x => x.disabled = x.dataset.o === o);
    });
  });
}

if (!SCRIPT || !KOD) {
  document.getElementById('katastasi').textContent =
    'Ο σύνδεσμος δεν είναι πλήρης — λείπει ο πελάτης. Ζήτησέ μας καινούργιο σύνδεσμο.';
} else {
  // ⚠️ Το Google απαντά κάπου-κάπου 404 στην πρώτη κλήση — τρεις προσπάθειες.
  (function fortose(p){
    fetch(SCRIPT + '?action=katagrafes&kod=' + encodeURIComponent(KOD) + '&t=' + Date.now())
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(d => { if (d && d.ok) render(d); else throw new Error((d && d.error) || 'άγνωστο'); })
      .catch(e => {
        if (p < 3) { document.getElementById('katastasi').textContent =
            'Φόρτωση δεδομένων… (προσπάθεια ' + (p + 1) + ')';
          setTimeout(function(){ fortose(p + 1); }, 2500); return; }
        document.getElementById('katastasi').textContent =
          'Δεν φορτώθηκαν τα δεδομένα (' + e.message + '). Δοκίμασε ξανά σε λίγο.';
      });
  })(1);
}
</script>
</body></html>
